<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Home · Northstar</title>
<link rel="icon" href="favicon.png">
<script src="js/ns-boot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=container-queries"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app-frame">

    <header class="ns-header">
        <div class="min-w-0">
            <h1 id="dashboard-greeting-title" class="ns-header__title break-words">Hello</h1>
            <p class="ns-header__meta">Thanks for helping out today.</p>
        </div>
        <div class="ns-header__actions">
            <button id="profile-btn" type="button" class="ns-icon-btn ns-avatar-btn" aria-label="Open settings" onclick="openSettingsModal()">V</button>
        </div>
    </header>

    <main class="ns-main dashboard-container volunteer-dashboard-main">

        <!-- Money donated from this phone (js/northstar.js fills #volunteer-total-donations) -->
        <div class="ns-card ns-card--pad flex items-center justify-between gap-4">
            <div>
                <p class="ns-card-sub">You’ve donated</p>
                <p id="volunteer-total-donations" class="ns-value mt-1">$0</p>
                <p class="ns-card-sub mt-1">Money donated from this phone</p>
            </div>
            <span class="ns-tile"><span class="material-symbols-outlined">volunteer_activism</span></span>
        </div>

        <div class="grid grid-cols-2 gap-3 mt-3">
            <a id="volunteer-post-job-card" href="opportunities.html" class="ns-card ns-card--pad flex flex-col gap-4 min-h-[124px]">
                <span class="ns-tile ns-tile--plain"><span class="material-symbols-outlined">add</span></span>
                <span class="mt-auto">
                    <span class="ns-card-title block">Post a job</span>
                    <span class="ns-card-sub block mt-1">Share paid work</span>
                </span>
            </a>
            <a id="volunteer-donate-card" href="donate.html" class="ns-card ns-card--pad flex flex-col gap-4 min-h-[124px]">
                <span class="ns-tile ns-tile--plain"><span class="material-symbols-outlined">restaurant</span></span>
                <span class="mt-auto">
                    <span class="ns-card-title block">Donate</span>
                    <span class="ns-card-sub block mt-1">Money or food</span>
                </span>
            </a>
        </div>

        <!-- Delivery this volunteer is carrying right now -->
        <div id="volunteer-active-delivery-container" class="hidden">
            <div class="ns-section-head"><h2>Your delivery</h2></div>
            <div class="ns-card ns-card--amber ns-card--pad">
                <div class="flex items-start gap-4">
                    <span class="ns-tile !bg-paper"><span class="material-symbols-outlined">local_shipping</span></span>
                    <div class="min-w-0 flex-1">
                        <p class="ns-card-title">To <span id="vad-destination">the shelter</span></p>
                        <p id="vad-details" class="ns-card-sub mt-1"></p>
                    </div>
                </div>
                <button type="button" onclick="if (window._openLastDeliveryTracker) window._openLastDeliveryTracker()" class="ns-btn ns-btn--primary mt-4">Update delivery</button>
            </div>
        </div>

        <section>
            <div class="ns-section-head">
                <h2>Food pickups</h2>
            </div>
            <div id="dashboard-deliveries-queue">
                <div class="ns-empty">
                    <p class="ns-empty__title">Checking for pickups…</p>
                </div>
            </div>
        </section>
    </main>

    <nav class="bottom-nav ns-nav" aria-label="Main"></nav>
</div>

<script>
(function () {
    function setGreeting() {
        const el = document.getElementById('dashboard-greeting-title');
        if (!el) return;
        const name = typeof window.nsDisplayName === 'function' ? window.nsDisplayName() : '';
        el.textContent = name ? `Hello, ${name.split(/\s+/)[0]}` : 'Hello';
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setGreeting);
    else setGreeting();
})();

window.initVolunteerActiveDelivery = async function () {
    const role = localStorage.getItem('northstar_user_role') || 'seeker';
    let session = null;
    try { session = JSON.parse(localStorage.getItem('northstar_session') || 'null'); } catch (e) {}
    const container = document.getElementById('volunteer-active-delivery-container');
    if (!container || role !== 'volunteer' || !session || !session.id) return;

    try {
        const res = await fetch('/api/deliveries');
        const data = await res.json();
        const activeJob = (data.deliveries || []).find(d =>
            d.driver_id === session.id &&
            ['in_transit', 'driver_assigned'].includes(d.status)
        );
        if (!activeJob) return;

        container.classList.remove('hidden');
        document.getElementById('vad-destination').textContent = activeJob.destination || 'the shelter';
        const bags = Number(activeJob.bags) || 0;
        const parts = [];
        if (bags) parts.push(`${bags} ${bags === 1 ? 'bag' : 'bags'}`);
        if (activeJob.donorArea) parts.push(`from ${activeJob.donorArea}`);
        const statusText = activeJob.status === 'in_transit' ? 'On the way' : 'Ready to pick up';
        document.getElementById('vad-details').textContent = [statusText, parts.join(' ')].filter(Boolean).join(' · ');

        window._openLastDeliveryTracker = () => {
            if (typeof openUberTrackingModal === 'function') openUberTrackingModal(activeJob.id);
        };
    } catch (err) {
        console.warn('Could not fetch active delivery status:', err);
    }
};
document.addEventListener('DOMContentLoaded', () => { setTimeout(initVolunteerActiveDelivery, 400); });
window.addEventListener('northstar_deliveries_updated', () => { initVolunteerActiveDelivery(); });
</script>
<script src="js/northstar.js"></script>
<script src="js/jobs.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (typeof window.renderVolunteerFoodDonationsQueue === 'function') window.renderVolunteerFoodDonationsQueue();
});
</script>
</body>
</html>
