<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Northstar | Progress</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="css/northstar.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "surface": "#0f1117",
                        "tertiary-container": "#0d1c2f",
                        "surface-variant": "#1a1d27",
                        "on-primary-container": "#7c839b",
                        "surface-container-lowest": "#12141c",
                        "primary-fixed-dim": "#bec6e0",
                        "on-surface": "#f8fafc",
                        "surface-tint": "#565e74",
                        "on-background": "#f8fafc",
                        "tertiary": "#000000",
                        "secondary": "#f59e0b",
                        "primary-fixed": "#dae2fd",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#161922",
                        "tertiary-fixed": "#d5e3fd",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#131b2e",
                        "secondary-fixed-dim": "#e2c62d",
                        "background": "#0f1117",
                        "on-tertiary-fixed-variant": "#3a485c",
                        "primary-container": "#131b2e",
                        "tertiary-fixed-dim": "#b9c7e0",
                        "outline": "#475569",
                        "surface-container": "#1e2230",
                        "on-tertiary-container": "#76859b",
                        "on-surface-variant": "#94a3b8",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#211b00",
                        "outline-variant": "#334155",
                        "surface-container-highest": "#282d3f",
                        "on-error": "#ffffff",
                        "surface-container-high": "#222737",
                        "on-tertiary-fixed": "#0d1c2f",
                        "primary": "#0d1c2f",
                        "surface-dim": "#0b0c10",
                        "surface-bright": "#161922",
                        "secondary-fixed": "#ffe24c",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#524600",
                        "inverse-on-surface": "#eff1f3",
                        "secondary-container": "#fcdf46",
                        "inverse-surface": "#2d3133",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#726200",
                        "inverse-primary": "#bec6e0",
                        "on-primary-fixed-variant": "#3f465c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    }
                },
            },
        }
    </script>
    <style>
        /* Hide scrollbar on the main canvas */
        .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>

<body class="bg-[#0F1117] min-h-screen flex items-center justify-center p-0 sm:py-6 text-slate-100 selection:bg-amber-500/30 selection:text-amber-300">

    <!-- Atmospheric Background Glows -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 left-1/4 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
    </div>

    <!-- Mobile Frame Shell -->
    <div class="app-frame w-full sm:max-w-[420px] min-h-screen sm:min-h-[860px] sm:max-h-[920px] bg-[#0F1117] sm:rounded-[44px] shadow-[0_0_70px_rgba(0,0,0,0.85)] relative flex flex-col overflow-hidden border-0 sm:border-[8px] sm:border-slate-800/80 z-10">

        <!-- App Header -->
        <header class="bg-[#0F1117]/90 backdrop-blur-md sticky top-0 z-40 flex justify-between items-center w-full px-5 pt-5 pb-3 border-b border-white/10">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-amber-400/10 border border-amber-400/30 flex items-center justify-center flex-shrink-0">
                    <span class="material-symbols-outlined text-amber-400 text-lg">timeline</span>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-white tracking-tight leading-tight font-heading">Progress</h1>
                    <p class="text-xs font-medium text-slate-400" style="color:#475569;">Every step forward matters.</p>
                </div>
            </div>
            <div class="header-actions-right flex items-center gap-2">
                <button id="header-user-avatar" type="button" onclick="openSettingsModal()" class="header-account-avatar flex-shrink-0 transition-transform active:scale-95 cursor-pointer select-none" title="Signed in as Seeker - Tap for Settings">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-400 to-amber-500 text-slate-950 font-black text-xs flex items-center justify-center shadow-[0_0_12px_rgba(245,158,11,0.4)] border border-amber-300 hover:brightness-110 transition-all">
                        S
                    </div>
                </button>
            </div>
        </header>

        <!-- Main Scrollable Canvas -->
        <main class="flex-grow px-4 pt-4 overflow-y-auto no-scrollbar space-y-3" style="padding-bottom: 90px; -webkit-overflow-scrolling: touch;">

            <!-- Journey Summary Card -->
            <div class="bg-white/[0.04] border border-white/10 rounded-[18px] p-4 space-y-3">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-sm font-extrabold text-white font-heading" style="color:#f1f5f9;">Your NorthStar Journey</h2>
                        <p class="text-xs font-medium mt-0.5" id="journey-progress-text" style="color:#facc15;">0 of 5 milestones completed</p>
                    </div>
                    <span id="journey-pct-badge" class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-amber-400/15 text-amber-400 border border-amber-400/30">0%</span>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-white/10 rounded-full h-2 overflow-hidden">
                    <div id="journey-progress-bar" class="bg-amber-400 h-full rounded-full transition-all duration-500" style="width:0%"></div>
                </div>

                <!-- Stepper Nodes -->
                <div class="relative flex items-center justify-between pt-1">
                    <div class="absolute left-0 top-1/2 w-full h-px bg-white/10 -translate-y-1/2 z-0"></div>
                    <div id="stepper-nodes" class="flex justify-between w-full relative z-10"></div>
                </div>
            </div>

            <!-- "Your Next Step" Hero Callout (rendered by JS, hidden initially) -->
            <div id="next-step-callout" class="hidden bg-[#FFE855] rounded-[18px] p-4 flex items-center justify-between gap-3">
                <div class="flex-1 min-w-0">
                    <p class="text-[10px] font-extrabold text-slate-700 uppercase tracking-wider mb-0.5">YOUR NEXT STEP</p>
                    <p id="next-step-label" class="text-sm font-extrabold text-slate-900 leading-tight font-heading">Find a Resource</p>
                </div>
                <a id="next-step-btn" href="resource-map.html" class="flex-shrink-0 px-3.5 py-2 bg-slate-950 text-white rounded-[12px] text-xs font-extrabold active:scale-95 transition-all shadow-sm flex items-center gap-1">
                    Go <span class="material-symbols-outlined text-xs">arrow_forward</span>
                </a>
            </div>

            <!-- Journey Milestone List (injected by JS) -->
            <section class="space-y-2" id="journey-list-container"></section>

            <!-- Account Footer -->
            <div class="pt-1 pb-2 text-center">
                <p id="progress-account-label" class="text-[11px] text-slate-500 font-medium"></p>
                <button onclick="localStorage.removeItem('northstar_session'); window.location.href='index.html';"
                    class="mt-1 text-[11px] text-amber-400/80 hover:text-amber-300 underline underline-offset-2 transition-colors">Switch Account</button>
            </div>

        </main>

        <!-- Floating Dock Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 w-full z-40 flex justify-around items-center px-3 py-2.5 bg-[#12141C]/80 backdrop-blur-xl shadow-[0px_-4px_25px_rgba(0,0,0,0.5)] border-t border-white/10">
            <!-- Dynamically rendered by northstar.js -->
        </nav>

        <!-- Milestone Details Drawer/Modal -->
        <div id="milestone-modal" class="absolute inset-0 z-[100] hidden flex-col justify-end">
            <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-md" onclick="closeModal('milestone-modal')"></div>
            <div class="modal-drawer bg-[#12141C] border border-white/10 w-full rounded-t-3xl p-6 transform translate-y-full transition-transform duration-300 ease-in-out relative flex flex-col max-h-[85vh] text-white shadow-2xl">
                <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto mb-5"></div>
                <h2 id="modal-title" class="text-lg font-extrabold text-white mb-2 font-heading">Milestone Details</h2>
                <p id="modal-desc" class="text-sm text-slate-300 mb-6 leading-relaxed">Details will appear here.</p>
                <div id="modal-actions" class="mt-auto pt-4 flex flex-col gap-3">
                    <!-- Dynamic Actions -->
                </div>
            </div>
        </div>

    </div>

    <script src="js/northstar.js"></script>
</body>

</html>
