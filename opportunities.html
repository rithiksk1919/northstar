<script>
window.deleteVolunteerJob = async function(id) {
  if (!confirm('Are you sure you want to delete this posted opportunity?')) return;
  try {
    const res = await fetch(`/api/jobs/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.success) {
      showNotification('Opportunity removed successfully.', 'info');
      loadOpportunities();
    }
  } catch (err) {
    console.error(err);
    showNotification('Failed to delete opportunity.', 'error');
  }
};

window.editVolunteerJob = function(id) {
  showNotification('Opening edit form...', 'info');
  openModal('post-job-modal');
};

window.triggerLiveFeedScan = async function() {
  const icon = document.getElementById('scan-btn-icon');
  const btn = document.getElementById('scan-live-feed-btn');
  
  if (icon) icon.classList.add('animate-spin');
  if (btn) btn.disabled = true;
  showNotification('🔄 Triggering live Apify + Gemini crawl for fresh gigs...', 'info');

  try {
    const res = await fetch('/api/trigger-scrape');
    const data = await res.json();
    showNotification(`✅ Live feed updated! Scraped ${data.count || 0} low-barrier gigs.`, 'success');
    window.loadOpportunities();
  } catch (err) {
    console.error('Trigger scrape error:', err);
    showNotification('Scrape trigger finished. Refreshing feed...', 'info');
    window.loadOpportunities();
  } finally {
    if (icon) icon.classList.remove('animate-spin');
    if (btn) btn.disabled = false;
  }
};

window.handleJobContactClick = function(encodedContact) {
  const contact = decodeURIComponent(encodedContact);
  
  window.open('https://seattle.craigslist.org/search/lbg?query=same+day+pay', '_blank', 'noopener,noreferrer');

  if (contact.includes('@')) {
    const email = contact.split('|')[0].trim();
    window.location.href = `mailto:${email}`;
    showNotification(`Opened website listing & email composer for ${email}`, 'success');
  } else if (contact.startsWith('http://') || contact.startsWith('https://')) {
    window.open(contact, '_blank', 'noopener,noreferrer');
  } else {
    const phoneMatch = contact.match(/\(?\d{3}\)?[-. ]?\d{3}[-. ]?\d{4}/);
    if (phoneMatch) {
      const cleanPhone = phoneMatch[0].replace(/[^0-9]/g, '');
      window.location.href = `tel:${cleanPhone}`;
      showNotification(`Opened website & dialing ${phoneMatch[0]}...`, 'success');
    } else {
      showNotification(`Opened website listing! Contact: ${contact}`, 'success');
    }
  }
};

window.playAudioPrepPrimer = function(encodedTitle) {
  const title = decodeURIComponent(encodedTitle);
  const lowerTitle = title.toLowerCase();
  
  let prepAdvice = '';
  
  if (lowerTitle.includes('move') || lowerTitle.includes('haul') || lowerTitle.includes('loading') || lowerTitle.includes('warehouse') || lowerTitle.includes('freight')) {
    prepAdvice = `For this heavy lifting and logistics gig, wear closed-toe work boots or sturdy sneakers, and bring durable work gloves. Protect your back when lifting objects over 40 pounds. Confirm the loading dock or address with the contractor before heading out. Cash payment is issued immediately upon shift completion.`;
  } else if (lowerTitle.includes('kitchen') || lowerTitle.includes('food') || lowerTitle.includes('dish') || lowerTitle.includes('cook') || lowerTitle.includes('prep')) {
    prepAdvice = `For kitchen and food prep work, bring your Food Handler card if available. Wear non-slip closed-toe shoes and comfortable clothing. Ensure your hair is tied back or wear a hat. Check in with the kitchen manager upon arrival and confirm shift break times and cash payout details.`;
  } else if (lowerTitle.includes('yard') || lowerTitle.includes('clean') || lowerTitle.includes('landscaping') || lowerTitle.includes('rake') || lowerTitle.includes('outdoor') || lowerTitle.includes('handyman')) {
    prepAdvice = `For outdoor yardwork, groundskeeping, and handyman tasks, dress in weather-appropriate layers, bring sun protection, and carry a water bottle. Tools will be provided on site. Verify the property address and cross-streets with the owner before starting.`;
  } else if (lowerTitle.includes('event') || lowerTitle.includes('setup') || lowerTitle.includes('stage') || lowerTitle.includes('chair')) {
    prepAdvice = `For event staging and setup, wear dark comfortable clothing and supportive shoes. Arrive 10 minutes early to meet your team lead. Confirm supervisor contact info and ensure same-day cash stipend is verified before shift ends.`;
  } else if (lowerTitle.includes('digital') || lowerTitle.includes('microtask') || lowerTitle.includes('online') || lowerTitle.includes('labeling') || lowerTitle.includes('testing')) {
    prepAdvice = `For instant digital microtasks and micro-jobs, ensure you have a stable internet connection or visit a local Wi-Fi hotspot. No ID or length verification is needed. Payout is issued directly to your digital cash wallet upon task submission.`;
  } else if (lowerTitle.includes('drop-in') || lowerTitle.includes('day labor') || lowerTitle.includes('center') || lowerTitle.includes('cash in hand')) {
    prepAdvice = `For drop-in daily labor and cash in hand gigs, check in at the drop-in site early in the morning. Bring a valid phone number or message contact. Confirm daily stipend terms upfront before starting your assignment.`;
  } else {
    prepAdvice = `Here is your preparation primer for ${title}. Always confirm meetup location, contact details, and agreed cash rate before starting work. Stay hydrated, prioritize workplace safety, and verify cash payment upon completion.`;
  }

  const fullSpeechText = `Audio Primer for ${title}. ${prepAdvice}`;

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(fullSpeechText);
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
  }

  showAudioPrimerModal(title, prepAdvice);
};

          <span class="material-symbols-outlined text-sm">volume_up</span> Replay Audio
        </button>
        <button onclick="closeAudioPrimerModal()" class="px-4 py-2 bg-slate-100 dark:bg-[#1A2130] text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white font-semibold text-xs rounded-xl border border-slate-200 dark:border-[#232C3F]">
          Done

    </div>
  `;

  modal.classList.remove('hidden');
};

window.closeAudioPrimerModal = function() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  const modal = document.getElementById('audio-primer-modal');
  if (modal) modal.classList.add('hidden');
};

window.replayAudioSpeech = function(encodedTitle, encodedAdvice) {
  const title = decodeURIComponent(encodedTitle);
  const advice = decodeURIComponent(encodedAdvice);
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(`Audio Primer for ${title}. ${advice}`);
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }
};

document.addEventListener('DOMContentLoaded', () => {
  window.loadOpportunities();
});


async function submitNewJob(e) {
  e.preventDefault();
  const title = document.getElementById('job-title-input').value.trim();
  const company = document.getElementById('job-company-input').value.trim();
  const pay = document.getElementById('job-pay-input').value.trim();
  const location = document.getElementById('job-location-input').value.trim();
  const reqs = document.getElementById('job-reqs-input').value.split(',').map(s => s.trim()).filter(Boolean);
  const contact = document.getElementById('job-contact-input').value.trim();

  const session = (typeof getSession === 'function') ? getSession() : JSON.parse(localStorage.getItem('northstar_session') || '{}');
  const authorId = session.id || session.email || 'anonymous_volunteer';

  try {
    const res = await fetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, company, pay, location, requirements: reqs, contact, authorId })
    });
    const data = await res.json();
    if (data.success) {
      closeModal('post-job-modal');
      showNotification('✨ Opportunity published and saved to Supabase! Seekers can now view your listing.', 'success');
      loadOpportunities();
    }
  } catch (err) {
    console.error(err);
    showNotification('Failed to publish opportunity.', 'error');
  }
}

  showNotification('🤖 Running Gemini AI Job Matcher against active seeker resumes...', 'info');
}
