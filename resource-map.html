<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Northstar | Live Resource Map</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/northstar.css">
<style>
    /* Fix click interactions by ignoring child elements */
    button * {
        pointer-events: none;
    }
    /* Expandable Bottom Drawer Sheet */
    #bottom-drawer-sheet.expanded {
        max-height: 55vh !important;
    }
</style>

<!-- Leaflet CSS & JS Bundle -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Dexie.js (IndexedDB wrapper for offline storage) -->
<script src="https://unpkg.com/dexie@3.2.4/dist/dexie.min.js"></script>
<!-- Leaflet.offline tile caching extension -->
<script src="https://unpkg.com/leaflet.offline@3.2.1/dist/leaflet.offline.min.js"></script>

<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "fontFamily": {
              "sans": ["Inter", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
              "heading": ["Plus Jakarta Sans", "sans-serif"]
            },
            "colors": {
              "dark-pill": "#0F141C",
              "brand-dark": "#0B0E14",
              "brand-accent": "#10B981"
            }
          },
        },
      }
</script>
<style>
  .leaflet-popup-content-wrapper {
    background: rgba(15, 20, 28, 0.92) !important;
    backdrop-filter: blur(20px) saturate(180%) !important;
    color: #ffffff !important;
    border-radius: 24px !important;
    padding: 6px !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4) !important;
  }
  .leaflet-popup-tip {
    background: rgba(15, 20, 28, 0.92) !important;
  }
  .leaflet-container {
    background: #EBF0F5 !important;
    font-family: 'Inter', -apple-system, sans-serif !important;
  }
  /* Hide Leaflet default attribution & controls for clean full-bleed experience */
  .leaflet-control-container .leaflet-bottom,
  .leaflet-control-container .leaflet-top {
    z-index: 20 !important;
  }
  /* Custom scrollbar for horizontal category shelf */
  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  /* Dynamic Station Spring Animations */
  .spring-transition {
    transition: all 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .ios-glass-station {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
  }
</style>
</head>

<body class="bg-[#0B0E14] min-h-screen flex items-center justify-center p-0 sm:py-6 text-slate-900 font-sans selection:bg-emerald-500/30 selection:text-emerald-300">

<!-- Mobile Frame Shell -->
<div class="app-frame w-full sm:max-w-[420px] min-h-screen sm:min-h-[860px] sm:max-h-[920px] bg-[#0B0E14] sm:rounded-[44px] shadow-[0_0_70px_rgba(0,0,0,0.85)] relative flex flex-col overflow-hidden border-0 sm:border-[8px] sm:border-slate-800/80 z-10">



    <!-- MAIN FULL-BLEED MAP CONTAINER -->
    <div class="relative w-full h-full flex-1 overflow-hidden flex flex-col">
        
        <!-- FULL-BLEED LEAFLET MAP -->
        <div id="map" class="absolute inset-0 w-full h-full z-0 bg-[#EBF0F5]"></div>

        <!-- OVERLAY LAYER: DYNAMIC FLOATING STATION LAYER (Z-INDEX 30) -->
        <div class="relative z-30 w-full h-full flex flex-col justify-between pointer-events-none pt-11 pb-4 px-3.5">

            <!-- SINGLE UNIFIED DYNAMIC FLOATING STATION (APPLE CONTROL CENTER / DYNAMIC ISLAND ARCHITECTURE) -->
            <div id="dynamic-floating-station" class="pointer-events-auto w-full rounded-[28px] ios-glass-station p-2.5 space-y-2.5 spring-transition">
                
                <!-- TIER 1: COLLAPSED CAPSULE ROW (MODE TOGGLE + ACTION BUTTONS TIGHTLY GROUPED) -->
                <div class="flex justify-between items-center w-full">
                    <!-- Segmented Mode Controller (Nearby vs Saved) -->
                    <div class="bg-slate-200/80 p-1 rounded-[20px] flex items-center gap-1 shadow-inner">
                        <button id="mode-btn-nearby" onclick="switchMapMode('nearby')" class="px-3.5 py-1.5 rounded-[16px] text-xs font-bold bg-white text-slate-950 shadow-sm transition-all">
                            Nearby
                        </button>
                        <button id="mode-btn-saved" onclick="switchMapMode('saved')" class="px-3.5 py-1.5 rounded-[16px] text-xs font-bold text-slate-600 hover:text-slate-950 transition-all">
                            Saved
                        </button>
                    </div>

                    <!-- Location Name Pill -->
                    <div class="px-3 py-1 rounded-[16px] bg-slate-100 text-slate-800 text-[11px] font-bold border border-slate-200 flex items-center gap-1 shadow-sm">
                        <span class="material-symbols-outlined text-xs text-emerald-600">location_on</span>
                        <span id="location-name-label">Seattle Area</span>
                    </div>

                    <!-- Tightly Grouped Integrated Circle Buttons -->
                    <div class="flex items-center gap-1.5">
                        <button onclick="locateAndCenterUser()" title="Share / Recenter Location" class="w-9 h-9 rounded-full bg-white text-slate-900 shadow-md flex items-center justify-center hover:bg-slate-100 active:scale-95 transition-all">
                            <span class="material-symbols-outlined text-base">near_me</span>
                        </button>
                        <button onclick="toggleAlertsModal()" title="Alerts" class="w-9 h-9 rounded-full bg-white text-slate-900 shadow-md flex items-center justify-center hover:bg-slate-100 active:scale-95 transition-all relative">
                            <span class="material-symbols-outlined text-base">notifications</span>
                            <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white"></span>
                        </button>
                    </div>
                </div>

                <!-- TIER 2: FILTER ROW (DYNAMIC INLINE EXPANSION FOR SCOPE & OPEN NOW) -->
                <div class="flex items-center justify-between gap-2 pt-0.5">
                    <!-- Scope Filter Segment (Everyone vs Verified Only) -->
                    <div class="bg-slate-200/80 p-0.5 rounded-[18px] flex items-center gap-0.5 shadow-inner flex-grow">
                        <button id="scope-btn-everyone" onclick="setScopeFilter('everyone')" class="flex-1 py-1.5 px-2.5 rounded-[14px] text-[11px] font-bold bg-white text-slate-950 shadow-sm transition-all text-center truncate">
                            Everyone
                        </button>
                        <button id="scope-btn-verified" onclick="setScopeFilter('verified')" class="flex-1 py-1.5 px-2.5 rounded-[14px] text-[11px] font-bold text-slate-600 hover:text-slate-950 transition-all text-center truncate flex items-center justify-center gap-1">
                            <span>Verified</span>
                            <span class="text-[9px] text-amber-500 font-black">✓</span>
                        </button>
                    </div>

                    <!-- Real Open Now Toggle Pill -->
                    <button id="open-now-btn" onclick="toggleOpenNowFilter()" class="py-1.5 px-3 rounded-[18px] bg-slate-100 text-slate-700 text-[11px] font-bold border border-slate-200 flex items-center gap-1.5 hover:bg-white transition-all shadow-sm flex-shrink-0">
                        <span id="open-now-dot" class="w-2 h-2 rounded-full bg-slate-400"></span>
                        <span id="open-now-text">Open now</span>
                    </button>
                </div>

                <!-- TIER 3: iOS SEGMENTED CATEGORY SHELF (MULTI-SELECT SUPPORTED) -->
                <div class="pt-0.5">
                    <div class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                        <button data-cat="all" onclick="toggleCategoryFilter('all')" class="cat-pill-btn px-3.5 py-1.5 rounded-[16px] text-[11px] font-extrabold bg-[#0F141C] text-white flex items-center gap-1 flex-shrink-0 shadow-md transition-all">
                            <span class="material-symbols-outlined text-xs text-emerald-400">auto_awesome</span>
                            <span>All</span>
                        </button>
                        <button data-cat="work" onclick="toggleCategoryFilter('work')" class="cat-pill-btn px-3.5 py-1.5 rounded-[16px] text-[11px] font-bold bg-white text-slate-800 flex items-center gap-1 flex-shrink-0 border border-slate-200 shadow-sm hover:bg-slate-50 transition-all">
                            <span class="material-symbols-outlined text-xs text-amber-500">work</span>
                            <span>Gigs</span>
                        </button>
                        <button data-cat="food" onclick="toggleCategoryFilter('food')" class="cat-pill-btn px-3.5 py-1.5 rounded-[16px] text-[11px] font-bold bg-white text-slate-800 flex items-center gap-1 flex-shrink-0 border border-slate-200 shadow-sm hover:bg-slate-50 transition-all">
                            <span class="material-symbols-outlined text-xs text-rose-500">restaurant</span>
                            <span>Meals</span>
                        </button>
                        <button data-cat="shelter" onclick="toggleCategoryFilter('shelter')" class="cat-pill-btn px-3.5 py-1.5 rounded-[16px] text-[11px] font-bold bg-white text-slate-800 flex items-center gap-1 flex-shrink-0 border border-slate-200 shadow-sm hover:bg-slate-50 transition-all">
                            <span class="material-symbols-outlined text-xs text-blue-500">single_bed</span>
                            <span>Shelter</span>
                        </button>
                        <button data-cat="wifi" onclick="toggleCategoryFilter('wifi')" class="cat-pill-btn px-3.5 py-1.5 rounded-[16px] text-[11px] font-bold bg-white text-slate-800 flex items-center gap-1 flex-shrink-0 border border-slate-200 shadow-sm hover:bg-slate-50 transition-all">
                            <span class="material-symbols-outlined text-xs text-indigo-500">wifi</span>
                            <span>Wi-Fi</span>
                        </button>
                        <button data-cat="restroom" onclick="toggleCategoryFilter('restroom')" class="cat-pill-btn px-3.5 py-1.5 rounded-[16px] text-[11px] font-bold bg-white text-slate-800 flex items-center gap-1 flex-shrink-0 border border-slate-200 shadow-sm hover:bg-slate-50 transition-all">
                            <span class="material-symbols-outlined text-xs text-teal-500">shower</span>
                            <span>Showers</span>
                        </button>
                        <button data-cat="charging" onclick="toggleCategoryFilter('charging')" class="cat-pill-btn px-3.5 py-1.5 rounded-[16px] text-[11px] font-bold bg-white text-slate-800 flex items-center gap-1 flex-shrink-0 border border-slate-200 shadow-sm hover:bg-slate-50 transition-all">
                            <span class="material-symbols-outlined text-xs text-yellow-500">power</span>
                            <span>Charging</span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- RADIUS SELECTOR BAR (CLEANLY CENTERED) -->
            <div class="w-full flex justify-center pointer-events-auto my-auto pt-1">
                <div id="radius-controls" class="bg-white/95 backdrop-blur-md px-3 py-1.5 rounded-full shadow-lg border border-slate-200/90 flex items-center gap-1.5 transition-all">
                    <span class="material-symbols-outlined text-xs text-emerald-600">adjust</span>
                    <span class="text-[10px] font-bold text-slate-700">Radius:</span>
                    <div class="flex items-center gap-1">
                        <button id="radius-btn-5" onclick="setSearchRadius(5)" class="radius-pill-btn px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-[#0F141C] text-white shadow-sm transition-all">5 mi</button>
                        <button id="radius-btn-10" onclick="setSearchRadius(10)" class="radius-pill-btn px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-all">10 mi</button>
                        <button id="radius-btn-25" onclick="setSearchRadius(25)" class="radius-pill-btn px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-all">25 mi</button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- ZOOM CONTROLS (DOCKED ABOVE BOTTOM DRAWER) -->
    <div class="absolute bottom-[134px] right-3.5 z-30 flex flex-col gap-2 pointer-events-auto">
        <button onclick="if(map) map.zoomIn()" title="Zoom In" class="w-9 h-9 bg-white text-slate-900 rounded-full shadow-md flex items-center justify-center font-bold text-lg hover:bg-slate-100 active:scale-95 transition-all border border-slate-200/80">+</button>
        <button onclick="if(map) map.zoomOut()" title="Zoom Out" class="w-9 h-9 bg-white text-slate-900 rounded-full shadow-md flex items-center justify-center font-bold text-lg hover:bg-slate-100 active:scale-95 transition-all border border-slate-200/80">-</button>
    </div>

    <!-- EXPANDABLE BOTTOM DRAWER SHEET ("PLACES LIST") -->
    <div id="bottom-drawer-sheet" class="absolute bottom-[72px] left-3 right-3 z-30 bg-white/95 backdrop-blur-xl rounded-[24px] shadow-[0_8px_30px_rgba(0,0,0,0.18)] border border-slate-200/80 transition-all duration-300 ease-out overflow-hidden flex flex-col pointer-events-auto" style="max-height: 54px;">
        <!-- DRAG HANDLE & HEADER BAR (CLICKABLE / DRAGGABLE) -->
        <div id="drawer-header" onclick="toggleBottomDrawer()" class="w-full pt-2 pb-2.5 px-4 cursor-pointer flex flex-col items-center select-none hover:bg-slate-50/60 transition-colors">
            <!-- Horizontal drag handle pill -->
            <div class="w-10 h-1 rounded-full bg-slate-300 mb-1.5"></div>
            
            <div class="w-full flex items-center justify-start gap-2">
                <span class="material-symbols-outlined text-base text-emerald-600">format_list_bulleted</span>
                <span id="drawer-title" class="text-xs font-extrabold text-slate-900 tracking-tight">Places & Resources</span>
                <span id="drawer-count-badge" class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-black">0</span>
            </div>
        </div>

        <!-- SCROLLABLE LIST CONTENT (REVEALED WHEN EXPANDED) -->
        <div id="places-list" class="drawer-content-list px-3 pb-3 pt-1 overflow-y-auto max-h-[46vh] space-y-2 no-scrollbar">
            <!-- Populated dynamically by renderDrawerPlaces() -->
        </div>
    </div>

    <!-- FLOATING ROUNDED BOTTOM NAVIGATION BAR -->
    <div class="absolute bottom-3 left-4 right-4 z-40">
        <nav class="bg-white/95 backdrop-blur-xl rounded-full py-2.5 px-4 shadow-[0_10px_30px_rgba(0,0,0,0.3)] border border-slate-200/80 flex items-center justify-between">
            
            <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-slate-900 transition-colors p-1">
                <span class="material-symbols-outlined text-xl">home</span>
            </a>

            <a href="resource-map.html" class="flex flex-col items-center text-slate-950 transition-colors p-1 relative">
                <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">map</span>
                <span class="w-1 h-1 rounded-full bg-slate-950 absolute -bottom-1"></span>
            </a>

            <a href="seeker-dashboard.html" class="flex flex-col items-center text-slate-400 hover:text-slate-900 transition-colors p-1">
                <span class="material-symbols-outlined text-xl">search</span>
            </a>

            <a href="resume-builder.html" class="flex flex-col items-center text-slate-400 hover:text-slate-900 transition-colors p-1">
                <span class="material-symbols-outlined text-xl">person</span>
            </a>

            <!-- Prominent Floating "+" Action Button for Volunteers / Posting Resources -->
            <button onclick="openAddResourceModal()" class="w-10 h-10 rounded-full bg-[#0F141C] text-white flex items-center justify-center shadow-lg hover:bg-slate-800 transition-all active:scale-95 border border-white/10 ml-1">
                <span class="material-symbols-outlined text-xl">add</span>
            </button>
        </nav>
    </div>

</div><!-- /.app-frame -->

<!-- MODAL: ADD RESOURCE / GIG -->
<div id="add-resource-modal" class="fixed inset-0 z-[100] hidden items-end sm:items-center justify-center bg-slate-950/80 backdrop-blur-md p-0 sm:p-4">
    <div class="w-full sm:max-w-md bg-[#0F141C] border border-slate-800 rounded-t-3xl sm:rounded-3xl p-6 text-white space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <h3 class="font-extrabold text-base flex items-center gap-2">
                <span class="material-symbols-outlined text-emerald-400">add_location_alt</span>
                Post Resource / Gig
            </h3>
            <button onclick="closeAddResourceModal()" class="text-slate-400 hover:text-white">
                <span class="material-symbols-outlined text-lg">close</span>
            </button>
        </div>

        <form id="new-resource-form" onsubmit="handleCreateResource(event)" class="space-y-3">
            <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Title / Location Name</label>
                <input type="text" id="res-title" required placeholder="e.g. Community Meal Distribution" class="w-full mt-1 p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs font-medium text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Category</label>
                    <select id="res-category" class="w-full mt-1 p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs font-medium text-white focus:outline-none focus:border-emerald-500">
                        <option value="food">Meal / Pantry</option>
                        <option value="shelter">Shelter Bed</option>
                        <option value="work">Gig Job</option>
                        <option value="wifi">Wi-Fi Access</option>
                        <option value="restroom">Showers / Restroom</option>
                        <option value="charging">Power Charging</option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Hours</label>
                    <input type="text" id="res-hours" placeholder="e.g. 08:00 - 20:00" class="w-full mt-1 p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs font-medium text-white focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Address / Location</label>
                <input type="text" id="res-address" required placeholder="e.g. 515 3rd Ave, Seattle" class="w-full mt-1 p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs font-medium text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Details & Instructions</label>
                <textarea id="res-details" rows="2" placeholder="Details for seekers..." class="w-full mt-1 p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs font-medium text-white focus:outline-none focus:border-emerald-500"></textarea>
            </div>

            <button type="submit" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold rounded-xl text-xs shadow-lg transition-all active:scale-[0.98]">
                Publish Location to Map
            </button>
        </form>
    </div>
</div>

<script src="js/northstar.js"></script>

    { id: 'res-real-10', name: "Compass Center Hygiene Station", category: "charging", lat: 47.6015, lng: -122.3348, status: "Open Now • Power Charging", address: "210 Alaskan Way S, Seattle", icon: "⚡", details: "Charging stations & resting area.", verifiedOnly: true, hoursOpen: "08:00", hoursClose: "18:00", is24Seven: false },
    { id: 'res-real-11', name: "Seattle Day Labor & Work Center", category: "work", lat: 47.5990, lng: -122.3250, status: "Open Now • Immediate Gigs", address: "150 S Washington St, Seattle", icon: "💼", details: "Daily paid tasks, maintenance gigs, and cash payouts.", verifiedOnly: true, hoursOpen: "06:00", hoursClose: "14:00", is24Seven: false }
  ];

  function getResourcesData() {
    try {
      const stored = localStorage.getItem('cached_resources');
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed;
        }
      }
    } catch (e) {
      console.warn('Error reading cached_resources:', e);
    }
    localStorage.setItem('cached_resources', JSON.stringify(defaultResources));
    return defaultResources;
  }

  async function loadResourcesFromDatabase() {
    if (window.supabaseClient) {
      try {
        const { data, error } = await window.supabaseClient.from('resources').select('*');
        if (!error && Array.isArray(data) && data.length > 0) {
          localStorage.setItem('cached_resources', JSON.stringify(data));
          if (typeof updateVisiblePlaces === 'function') {
            updateVisiblePlaces();
          }
        }
      } catch (err) {
        console.warn('Could not query Supabase resources table, keeping default mock items:', err);
      }
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    initLeafletCleanMap();
    loadResourcesFromDatabase();
  });

  function initLeafletCleanMap() {
    const startCoords = [47.6062, -122.3321]; // Downtown Seattle

    map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView(startCoords, 14);

    offlineLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Real-time live auto-updating markers & places as user pans or zooms map
    map.on('moveend zoomend', () => {
      updateVisiblePlaces();
    });

    locateAndCenterUser();
  }

  function getActiveReferenceCoords() {
    // 1. If userLocationCoords is set, valid, and within 60 miles of the Seattle mock cluster
    if (userLocationCoords && typeof userLocationCoords.lat === 'number' && typeof userLocationCoords.lng === 'number') {
      if (userLocationCoords.lat !== 0 && userLocationCoords.lng !== 0) {
        const distFromCluster = calculateDistanceMiles(userLocationCoords.lat, userLocationCoords.lng, 47.6062, -122.3321);
        if (distFromCluster < 60) {
          return userLocationCoords;
        }
      }
    }
    // 2. Otherwise use map center if valid
    if (map && typeof map.getCenter === 'function') {
      const c = map.getCenter();
      if (c && c.lat && c.lng && (c.lat !== 0 || c.lng !== 0)) {
        return { lat: c.lat, lng: c.lng };
      }
    }
    // 3. Fallback to Downtown Seattle anchor
    return { lat: 47.6062, lng: -122.3321 };
  }

  function renderBlueDot(latitude, longitude) {
    if (!map) return;
    userLocationCoords = { lat: latitude, lng: longitude };

    if (userLocationMarker) map.removeLayer(userLocationMarker);
    if (userRadiusCircle) map.removeLayer(userRadiusCircle);

    const radiusMeters = activeRadiusMiles * 1609.34;

    userRadiusCircle = L.circle([latitude, longitude], {
      radius: radiusMeters,
      color: '#10B981',
      fillColor: '#10B981',
      fillOpacity: 0.08,
      weight: 1.5,
      dashArray: '4, 6'
    }).addTo(map);

    const blueDotIcon = L.divIcon({
      className: 'user-blue-dot-marker',
      html: `
        <div class="relative w-7 h-7 flex items-center justify-center">
          <div class="absolute w-7 h-7 rounded-full bg-emerald-500/30 animate-ping"></div>
          <div class="w-4 h-4 rounded-full bg-emerald-500 border-2 border-white shadow-lg"></div>
        </div>
      `,
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });

    userLocationMarker = L.marker([latitude, longitude], { icon: blueDotIcon, zIndexOffset: 1000 }).addTo(map);
    userLocationMarker.bindPopup('<b style="color:#ffffff;">📍 Your Location</b>');

    updateVisiblePlaces();
  }

  function locateAndCenterUser() {
    if (!navigator.geolocation) {
      renderBlueDot(47.6062, -122.3321);
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        const dist = calculateDistanceMiles(latitude, longitude, 47.6062, -122.3321);
        // If user is outside Puget Sound / Seattle (>60 mi away), anchor to Seattle mock cluster
        if (dist > 60) {
          renderBlueDot(47.6062, -122.3321);
        } else {
          renderBlueDot(latitude, longitude);
          map.flyTo([latitude, longitude], 14, { animate: true });
        }
      },
      (err) => {
        renderBlueDot(47.6062, -122.3321);
      },
      { enableHighAccuracy: true, timeout: 5000 }
    );
  }

  function switchMapMode(mode) {
    const nearbyBtn = document.getElementById('mode-btn-nearby');
    const savedBtn = document.getElementById('mode-btn-saved');

    if (mode === 'nearby') {
      nearbyBtn.className = 'px-3.5 py-1.5 rounded-[16px] text-xs font-bold bg-white text-slate-950 shadow-sm transition-all';
      savedBtn.className = 'px-3.5 py-1.5 rounded-[16px] text-xs font-bold text-slate-600 hover:text-slate-950 transition-all';
    } else {
      savedBtn.className = 'px-3.5 py-1.5 rounded-[16px] text-xs font-bold bg-white text-slate-950 shadow-sm transition-all';
      nearbyBtn.className = 'px-3.5 py-1.5 rounded-[16px] text-xs font-bold text-slate-600 hover:text-slate-950 transition-all';
    }
  }

  function setScopeFilter(scope) {
    activeScopeFilter = scope;
    const everyoneBtn = document.getElementById('scope-btn-everyone');
    const verifiedBtn = document.getElementById('scope-btn-verified');

    if (scope === 'everyone') {
      everyoneBtn.className = 'flex-1 py-1.5 px-2.5 rounded-[14px] text-[11px] font-bold bg-white text-slate-950 shadow-sm transition-all text-center truncate';
      verifiedBtn.className = 'flex-1 py-1.5 px-2.5 rounded-[14px] text-[11px] font-bold text-slate-600 hover:text-slate-950 transition-all text-center truncate flex items-center justify-center gap-1';
    } else {
      verifiedBtn.className = 'flex-1 py-1.5 px-2.5 rounded-[14px] text-[11px] font-bold bg-white text-slate-950 shadow-sm transition-all text-center truncate flex items-center justify-center gap-1';
      everyoneBtn.className = 'flex-1 py-1.5 px-2.5 rounded-[14px] text-[11px] font-bold text-slate-600 hover:text-slate-950 transition-all text-center truncate';
    }

    applyCombinedFilters();
  }

  function toggleOpenNowFilter() {
    isOpenNowFilterActive = !isOpenNowFilterActive;
    const btn = document.getElementById('open-now-btn');
    const dot = document.getElementById('open-now-dot');

    if (isOpenNowFilterActive) {
      btn.className = 'py-1.5 px-3 rounded-[18px] bg-[#0F141C] text-white text-[11px] font-bold border border-white/20 flex items-center gap-1.5 transition-all shadow-md';
      dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
    } else {
      btn.className = 'py-1.5 px-3 rounded-[18px] bg-slate-100 text-slate-700 text-[11px] font-bold border border-slate-200 flex items-center gap-1.5 hover:bg-white transition-all shadow-sm';
      dot.className = 'w-2 h-2 rounded-full bg-slate-400';
    }

    applyCombinedFilters();
  }

  function toggleCategoryFilter(cat) {
    if (cat === 'all') {
      activeSelectedCategories = ['all'];
    } else {
      // Remove 'all' if specific category clicked
      activeSelectedCategories = activeSelectedCategories.filter(c => c !== 'all');
      
      if (activeSelectedCategories.includes(cat)) {
        activeSelectedCategories = activeSelectedCategories.filter(c => c !== cat);
      } else {
        activeSelectedCategories.push(cat);
      }

      if (activeSelectedCategories.length === 0) {
        activeSelectedCategories = ['all'];
      }
    }

    // Update UI chips
    document.querySelectorAll('.cat-pill-btn').forEach(btn => {
      const bCat = btn.dataset.cat;
      if (activeSelectedCategories.includes(bCat)) {
        btn.className = 'cat-pill-btn px-3.5 py-1.5 rounded-[16px] text-[11px] font-extrabold bg-[#0F141C] text-white flex items-center gap-1 flex-shrink-0 shadow-md border border-white/10 transition-all';
      } else {
        btn.className = 'cat-pill-btn px-3.5 py-1.5 rounded-[16px] text-[11px] font-bold bg-white text-slate-800 flex items-center gap-1 flex-shrink-0 border border-slate-200 shadow-sm hover:bg-slate-50 transition-all';
      }
    });

    applyCombinedFilters();
  }

  // REAL COMBINED MULTI-FILTER FUNCTION (INTERSECTING AND LOGIC)
  function applyCombinedFilters() {
    const resources = getResourcesData();
    const currentDeviceTime = new Date();
    const currentMinutesFromMidnight = currentDeviceTime.getHours() * 60 + currentDeviceTime.getMinutes();

    const bounds = map ? map.getBounds() : null;
    const refCoords = getActiveReferenceCoords();

    // 1. Filter by category, scope, and open-now time
    const baseMatchingPins = resources.filter(pin => {
      // Category Match
      const matchesCategory = activeSelectedCategories.includes('all') || activeSelectedCategories.includes(pin.category);

      // Verified Scope Match
      let matchesScope = true;
      if (activeScopeFilter === 'verified') {
        matchesScope = (pin.verifiedOnly === true);
      }

      // Open Now Time Match
      let matchesOpenNow = true;
      if (isOpenNowFilterActive) {
        if (pin.is24Seven) {
          matchesOpenNow = true;
        } else if (pin.hoursOpen && pin.hoursClose) {
          const [oH, oM] = pin.hoursOpen.split(':').map(Number);
          const [cH, cM] = pin.hoursClose.split(':').map(Number);
          const openMin = oH * 60 + oM;
          const closeMin = cH * 60 + cM;
          matchesOpenNow = (currentMinutesFromMidnight >= openMin && currentMinutesFromMidnight <= closeMin);
        } else {
          matchesOpenNow = pin.status && pin.status.toLowerCase().includes('open');
        }
      }

      return matchesCategory && matchesScope && matchesOpenNow;
    });

    // Score all candidate pins by distance in miles relative to active reference coordinates
    const pool = baseMatchingPins.length > 0 ? baseMatchingPins : resources;
    const scoredPins = pool.map(pin => {
      const dist = calculateDistanceMiles(refCoords.lat, refCoords.lng, pin.lat, pin.lng);
      const inBounds = bounds ? bounds.contains([pin.lat, pin.lng]) : true;
      const inRadius = (dist <= activeRadiusMiles);
      return {
        ...pin,
        distanceMiles: dist,
        inBounds,
        inRadius
      };
    });

    // Strict boundary & radius match
    let filteredPins = scoredPins.filter(p => p.inBounds && p.inRadius);

    // If no markers fall within strict boundaries, automatically include the nearest 5 available resources regardless of tight radius limits so the UI always has content
    if (filteredPins.length === 0) {
      const sorted = [...scoredPins].sort((a, b) => a.distanceMiles - b.distanceMiles);
      filteredPins = sorted.slice(0, 5);
    }

    renderLeafletMarkers(filteredPins);
    renderDrawerPlaces(filteredPins);
  }

  function updateVisiblePlaces() {
    applyCombinedFilters();
  }
  window.updateVisiblePlaces = updateVisiblePlaces;

    items.forEach(res => {

      const marker = L.marker([res.lat, res.lng], { icon: customIcon }).addTo(map);

      const popupContent = `

          </div>

          ${res.hoursOpen ? `<p class="text-[10px] text-slate-400 font-mono">🕒 Hours: ${res.hoursOpen} - ${res.hoursClose}</p>` : ''}
          ${res.details ? `<p class="text-[11px] text-slate-300 bg-slate-900 p-2 rounded-xl border border-slate-800 mt-1">${res.details}</p>` : ''}
          <div class="pt-2 border-t border-slate-800">
            <a href="https://www.google.com/maps/dir/?api=1&destination=${res.lat},${res.lng}&travelmode=walking" target="_blank" class="block w-full text-center py-2 bg-emerald-500 text-slate-950 font-extrabold text-xs rounded-xl shadow hover:bg-emerald-400 transition-colors">
              🚶 Directions
            </a>
          </div>

      marker.bindPopup(popupContent);
      mapMarkers.push({ resId: res.id, marker: marker, data: res });
    });
  }

  function openAddResourceModal() {
    document.getElementById('add-resource-modal').classList.remove('hidden');
    document.getElementById('add-resource-modal').classList.add('flex');
  }

  function closeAddResourceModal() {
    document.getElementById('add-resource-modal').classList.add('hidden');
    document.getElementById('add-resource-modal').classList.remove('flex');
  }

  function toggleAlertsModal() {
    if (typeof showNotification === 'function') {
      showNotification('🔔 All shelter & food alerts in this area are active', 'info');
    }
  }

  function handleCreateResource(e) {
    e.preventDefault();
    const title = document.getElementById('res-title').value;
    const category = document.getElementById('res-category').value;
    const hours = document.getElementById('res-hours').value || '08:00 - 20:00';
    const address = document.getElementById('res-address').value;
    const details = document.getElementById('res-details').value;

    const [hOpen, hClose] = hours.split('-').map(s => s.trim());

    const center = userLocationCoords || { lat: 47.6062, lng: -122.3321 };

    const newRes = {
      id: 'res-custom-' + Date.now(),
      name: title,
      category: category,
      lat: center.lat + (Math.random() * 0.01 - 0.005),
      lng: center.lng + (Math.random() * 0.01 - 0.005),
      status: 'Open Now • Community Submitted',
      address: address,
      icon: category === 'food' ? '🍲' : category === 'shelter' ? '🛏️' : category === 'work' ? '💼' : '📍',
      details: details,
      verifiedOnly: true,
      hoursOpen: hOpen || "08:00",
      hoursClose: hClose || "20:00",
      is24Seven: false
    };

    const currentData = getResourcesData();
    currentData.unshift(newRes);
    localStorage.setItem('cached_resources', JSON.stringify(currentData));

    closeAddResourceModal();
    applyCombinedFilters();

    if (typeof showNotification === 'function') {
      showNotification('✨ New resource published to live map!', 'success');
    }
  }

  // RADIUS MODIFIER LOGIC
  function setSearchRadius(miles) {
    activeRadiusMiles = miles;
    
    [5, 10, 25].forEach(m => {
      const btn = document.getElementById(`radius-btn-${m}`);
      if (btn) {
        if (m === miles) {
          btn.className = 'radius-pill-btn px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-[#0F141C] text-white shadow-sm transition-all';
        } else {
          btn.className = 'radius-pill-btn px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-all';
        }
      }
    });

    if (userRadiusCircle) {
      userRadiusCircle.setRadius(miles * 1609.34);
    }

    updateVisiblePlaces();
  }

  function calculateDistanceMiles(lat1, lon1, lat2, lon2) {
    if (lat1 === undefined || lon1 === undefined || lat2 === undefined || lon2 === undefined) return 0;
    const R = 3958.8; // Radius of the Earth in miles
    const toRad = deg => (deg * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    const dist = R * c;
    return isNaN(dist) ? 0 : dist;
  }

  // BOTTOM DRAWER EXPAND / COLLAPSE & PLACES LIST RENDERING
  function toggleBottomDrawer(forceState) {
    const drawer = document.getElementById('bottom-drawer-sheet');
    if (!drawer) return;

    if (typeof forceState === 'boolean') {
      isDrawerExpanded = forceState;
    } else {
      isDrawerExpanded = !isDrawerExpanded;
    }

    if (isDrawerExpanded) {
      drawer.classList.add('expanded');
    } else {
      drawer.classList.remove('expanded');
    }
  }

  function renderDrawerPlaces(items) {
    const listEl = document.getElementById('places-list') || document.getElementById('drawer-content-list');
    const badgeEl = document.getElementById('drawer-count-badge');
    const titleEl = document.getElementById('drawer-title');
    if (!listEl) return;

    const count = items ? items.length : 0;
    if (badgeEl) {
      badgeEl.textContent = count;
    }
    if (titleEl) {
      titleEl.textContent = `Places & Resources (${count})`;
    }

    if (!items || items.length === 0) {
      listEl.innerHTML = `
        <div class="p-6 text-center text-slate-500">
          <span class="material-symbols-outlined text-3xl text-slate-400 mb-1">search_off</span>
          <p class="text-xs font-bold text-slate-700">No resources found</p>
          <p class="text-[11px] text-slate-500 mt-0.5">Try expanding your search radius (e.g. 10 or 25 mi) or adjusting filters.</p>
        </div>
      `;
      return;
    }

    const refCoords = getActiveReferenceCoords();

    const sorted = [...items].map(pin => {
      const dist = pin.distanceMiles !== undefined ? pin.distanceMiles : calculateDistanceMiles(refCoords.lat, refCoords.lng, pin.lat, pin.lng);
      return { ...pin, distanceMiles: dist };
    }).sort((a, b) => a.distanceMiles - b.distanceMiles);

    listEl.innerHTML = sorted.map(res => {
      const distStr = res.distanceMiles.toFixed(1) + ' mi';
      const catColor = res.category === 'food' ? 'text-rose-600 bg-rose-50'
                     : res.category === 'shelter' ? 'text-blue-600 bg-blue-50'
                     : res.category === 'work' ? 'text-amber-600 bg-amber-50'
                     : res.category === 'wifi' ? 'text-indigo-600 bg-indigo-50'
                     : res.category === 'restroom' ? 'text-teal-600 bg-teal-50'
                     : 'text-yellow-600 bg-yellow-50';

      return `
        <div class="p-2.5 bg-slate-50 hover:bg-slate-100/90 rounded-2xl border border-slate-200/70 shadow-sm flex items-center justify-between gap-2.5 transition-all">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5 mb-0.5">
              <span class="text-sm flex-shrink-0">${res.icon || '📍'}</span>
              <h5 class="text-xs font-extrabold text-slate-900 truncate">${res.name}</h5>
              ${res.verifiedOnly ? '<span class="text-[9px] text-amber-500 font-black flex-shrink-0" title="Verified">✓</span>' : ''}
            </div>
            <div class="flex items-center gap-1.5 text-[11px] text-slate-500 mb-0.5">
              <span class="font-extrabold text-emerald-600 flex items-center gap-0.5">
                <span class="material-symbols-outlined text-[12px]">near_me</span>
                ${distStr} away
              </span>
              <span>•</span>
              <span class="px-1.5 py-0.2 rounded text-[10px] font-bold ${catColor} capitalize">${res.category}</span>
            </div>
            <p class="text-[10px] font-medium text-slate-600 truncate">${res.status}</p>
          </div>
          <div class="flex flex-col items-end gap-1 flex-shrink-0">
            <button onclick="selectAndFocusPlace('${res.id}', ${res.lat}, ${res.lng})" class="px-3 py-1.5 bg-[#0F141C] text-white hover:bg-slate-800 text-[11px] font-extrabold rounded-xl shadow-sm transition-all active:scale-95 flex items-center gap-1">
              <span>View</span>
              <span class="material-symbols-outlined text-[12px] text-emerald-400">arrow_forward</span>
            </button>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${res.lat},${res.lng}&travelmode=walking" target="_blank" class="text-[10px] font-bold text-slate-500 hover:text-slate-800">
              Directions ↗
            </a>
          </div>
        </div>
      `;
    }).join('');
  }

  function selectAndFocusPlace(resId, lat, lng) {
    if (!map) return;
    map.flyTo([lat, lng], 16, { animate: true, duration: 0.8 });
    const targetMarker = mapMarkers.find(m => m.resId === resId);
    if (targetMarker && targetMarker.marker) {
      setTimeout(() => {
        targetMarker.marker.openPopup();
      }, 500);
    }
    toggleBottomDrawer(false);
  }

  // TOUCH SWIPE-UP / SWIPE-DOWN GESTURE LISTENER FOR DRAWER HEADER
  document.addEventListener('DOMContentLoaded', () => {
    let touchStartY = 0;
    const header = document.getElementById('drawer-header');
    if (header) {
      header.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      header.addEventListener('touchend', (e) => {
        const touchEndY = e.changedTouches[0].clientY;
        const diffY = touchStartY - touchEndY;
        if (diffY > 30) {
          // Swiped up
          toggleBottomDrawer(true);
        } else if (diffY < -30) {
          // Swiped down
          toggleBottomDrawer(false);
        }
      }, { passive: true });
    }
  });
</script>
