<!DOCTYPE html>

<script>
  let map;
  let offlineLayer;
  let mapMarkers = [];
  let userLocationMarker = null;
  let userRadiusCircle = null;
  let userLocationCoords = null;
  
  // REAL FILTERING STATE CONTROLLERS
  let activeSelectedCategories = ['all']; // Multi-select array
  let isOpenNowFilterActive = true;       // Set Open Now active by default on page load
  let activeScopeFilter = 'everyone';   // 'everyone' or 'verified'
  let activeRadiusMiles = 5;            // Radius modifier (5, 10, 25 miles)
  let activeMapMode = 'nearby';         // 'nearby' or 'saved'
  let isDrawerExpanded = false;

  // USER BOOKMARKED / SAVED PLACES STATE & PERSISTENCE
  const USER_SAVED_STORAGE_KEY = 'northstar_user_saved_places';

  function getSavedPlaceIds() {
    try {
      const stored = localStorage.getItem(USER_SAVED_STORAGE_KEY);
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {
      console.warn('Error reading saved places:', e);
    }
    return [];
  }

  function isPlaceSaved(placeId) {
    const list = getSavedPlaceIds();
    return list.includes(placeId);
  }

  async function toggleSavePlace(placeId, event) {
    if (event && event.stopPropagation) {
      event.stopPropagation();
    }

    const currentList = getSavedPlaceIds();
    const idx = currentList.indexOf(placeId);
    let isNowSaved = false;

    if (idx >= 0) {
      currentList.splice(idx, 1);
      isNowSaved = false;
    } else {
      currentList.push(placeId);
      isNowSaved = true;
    }

    localStorage.setItem(USER_SAVED_STORAGE_KEY, JSON.stringify(currentList));

    // Optional Supabase persistence if user is authenticated
    if (window.supabaseClient) {
      try {
        const session = JSON.parse(localStorage.getItem('northstar_session') || '{}');
        const userId = session.id || session.userId;
        if (userId) {
          if (isNowSaved) {
            await window.supabaseClient.from('user_saved_places').upsert({
              user_id: userId,
              place_id: placeId,
              created_at: new Date().toISOString()
            });
          } else {
            await window.supabaseClient.from('user_saved_places').delete()
              .match({ user_id: userId, place_id: placeId });
          }
        }
      } catch (err) {
        console.warn('Supabase user_saved_places sync warning:', err);
      }
    }

    if (typeof showNotification === 'function') {
      showNotification(isNowSaved ? '🔖 Place added to your Saved places' : 'Removed from Saved places', isNowSaved ? 'success' : 'info');
    }

    applyCombinedFilters();
  }
  window.toggleSavePlace = toggleSavePlace;

  const defaultResources = [
    {

      verifiedOnly: true,
      hoursOpen: "11:00",

      daysClosed: [],
      is24Seven: false,
      opening_hours: {
        open_now: true,
        periods: [
          { open: { day: 0, time: "1100" }, close: { day: 0, time: "1800" } }, // Sun 11am-6pm
          { open: { day: 1, time: "1000" }, close: { day: 1, time: "2000" } }, // Mon 10am-8pm
          { open: { day: 2, time: "1000" }, close: { day: 2, time: "2000" } }, // Tue 10am-8pm
          { open: { day: 3, time: "1000" }, close: { day: 3, time: "2000" } }, // Wed 10am-8pm
          { open: { day: 4, time: "1000" }, close: { day: 4, time: "2000" } }, // Thu 10am-8pm
          { open: { day: 5, time: "1000" }, close: { day: 5, time: "1800" } }, // Fri 10am-6pm
          { open: { day: 6, time: "1000" }, close: { day: 6, time: "1700" } }  // Sat 10am-5pm
        ],
        weekday_text: [
          "Monday: 10:00 AM – 8:00 PM",
          "Tuesday: 10:00 AM – 8:00 PM",
          "Wednesday: 10:00 AM – 8:00 PM",
          "Thursday: 10:00 AM – 8:00 PM",

  const RESOURCE_STORAGE_KEY = 'cached_resources_v2_live_hours';

  function getResourcesData() {
    try {
      const stored = localStorage.getItem(RESOURCE_STORAGE_KEY);
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed;
        }
      }
    } catch (e) {
      console.warn('Error reading cached resources:', e);
    }
    localStorage.setItem(RESOURCE_STORAGE_KEY, JSON.stringify(defaultResources));
    return defaultResources;
  }

  async function loadResourcesFromDatabase() {
    if (window.supabaseClient) {
      try {
        const { data, error } = await window.supabaseClient.from('resources').select('*');
        if (!error && Array.isArray(data) && data.length > 0) {
          localStorage.setItem('cached_resources', JSON.stringify(data));
          if (typeof updateVisiblePlaces === 'function') {
            updateVisiblePlaces();
          }
        }
      } catch (err) {
        console.warn('Could not query Supabase resources table, keeping default mock items:', err);
      }
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    initLeafletCleanMap();
    loadResourcesFromDatabase();
  });

  function initLeafletCleanMap() {
    const startCoords = [47.6062, -122.3321]; // Downtown Seattle

    map = L.map('map', {
      zoomControl: false,
      attributionControl: false
    }).setView(startCoords, 14);

    offlineLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Do not rebuild every marker while NorthStar is programmatically
    // focusing a resource. Rebuilding markers destroys an open popup.
    map.on('moveend zoomend', () => {
      if (window.northstarProgrammaticMapFocus) {
        return;
      }

      updateVisiblePlaces();
    });

    locateAndCenterUser();
  }

  function getActiveReferenceCoords() {
    // 1. If userRadiusCircle exists, its center is the exact center of the active search perimeter
    if (userRadiusCircle && typeof userRadiusCircle.getLatLng === 'function') {
      const circleCenter = userRadiusCircle.getLatLng();
      if (circleCenter && circleCenter.lat && circleCenter.lng) {
        return { lat: circleCenter.lat, lng: circleCenter.lng };
      }
    }
    // 2. If userLocationCoords is set, valid, and within 60 miles of the Seattle mock cluster
    if (userLocationCoords && typeof userLocationCoords.lat === 'number' && typeof userLocationCoords.lng === 'number') {
      if (userLocationCoords.lat !== 0 && userLocationCoords.lng !== 0) {
        const distFromCluster = calculateDistanceMiles(userLocationCoords.lat, userLocationCoords.lng, 47.6062, -122.3321);
        if (distFromCluster < 60) {
          return userLocationCoords;
        }
      }
    }
    // 3. Otherwise use map center if valid
    if (map && typeof map.getCenter === 'function') {
      const c = map.getCenter();
      if (c && c.lat && c.lng && (c.lat !== 0 || c.lng !== 0)) {
        return { lat: c.lat, lng: c.lng };
      }
    }
    // 4. Fallback to Downtown Seattle anchor
    return { lat: 47.6062, lng: -122.3321 };
  }

  function renderBlueDot(latitude, longitude) {
    if (!map) return;
    userLocationCoords = { lat: latitude, lng: longitude };

    if (userLocationMarker) map.removeLayer(userLocationMarker);
    if (userRadiusCircle) map.removeLayer(userRadiusCircle);

    const radiusMeters = activeRadiusMiles * 1609.34;

    userRadiusCircle = L.circle([latitude, longitude], {
      radius: radiusMeters,
      color: '#10B981',
      fillColor: '#10B981',
      fillOpacity: 0.08,
      weight: 1.5,
      dashArray: '4, 6'
    }).addTo(map);

    const blueDotIcon = L.divIcon({
      className: 'user-blue-dot-marker',
      html: `
        <div class="relative w-7 h-7 flex items-center justify-center">
          <div class="absolute w-7 h-7 rounded-full bg-emerald-500/30 animate-ping"></div>
          <div class="w-4 h-4 rounded-full bg-emerald-500 border-2 border-white shadow-lg"></div>
        </div>
      `,
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });

    userLocationMarker = L.marker([latitude, longitude], { icon: blueDotIcon, zIndexOffset: 1000 }).addTo(map);
    userLocationMarker.bindPopup('<b style="color:#ffffff;">📍 Your Location</b>');

    // Auto-fit bounds around the initial circle perimeter
    if (map && typeof map.fitBounds === 'function' && userRadiusCircle) {
      map.fitBounds(userRadiusCircle.getBounds(), { padding: [20, 20], animate: true });
    }

    updateVisiblePlaces();
  }

  function locateAndCenterUser() {
    if (!navigator.geolocation) {
      renderBlueDot(47.6062, -122.3321);
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        const dist = calculateDistanceMiles(latitude, longitude, 47.6062, -122.3321);
        // If user is outside Puget Sound / Seattle (>60 mi away), anchor to Seattle mock cluster
        if (dist > 60) {
          renderBlueDot(47.6062, -122.3321);
        } else {
          renderBlueDot(latitude, longitude);
          map.flyTo([latitude, longitude], 14, { animate: true });
        }
      },
      (err) => {
        renderBlueDot(47.6062, -122.3321);
      },
      { enableHighAccuracy: true, timeout: 5000 }
    );
  }

  function toggleCategoryFilter(cat) {
    if (cat === 'all') {
      activeSelectedCategories = ['all'];
    } else {
      // Remove 'all' if specific category clicked
      activeSelectedCategories = activeSelectedCategories.filter(c => c !== 'all');
      
      if (activeSelectedCategories.includes(cat)) {
        activeSelectedCategories = activeSelectedCategories.filter(c => c !== cat);
      } else {
        activeSelectedCategories.push(cat);
      }

      if (activeSelectedCategories.length === 0) {
        activeSelectedCategories = ['all'];
      }
    }

    // Update UI chips
    document.querySelectorAll('.cat-pill-btn').forEach(btn => {
      const bCat = btn.dataset.cat;
      if (activeSelectedCategories.includes(bCat)) {

      }

    applyCombinedFilters();

  function filterPlacesByRadius(places, selectedRadius) {
    const refCoords = getActiveReferenceCoords();
    const threshold = Number(selectedRadius) || activeRadiusMiles || 5;

    return (places || [])
      .map(place => {
        const dist = calculateDistanceMiles(refCoords.lat, refCoords.lng, place.lat, place.lng);
        return { ...place, distanceMiles: dist };
      })
      .filter(place => place.distanceMiles <= threshold);
  }
  window.filterPlacesByRadius = filterPlacesByRadius;

  // Helper: Dynamic Google Maps / Places API compatible "Open Now" evaluator
  function isPlaceOpenNow(place, targetDate = new Date()) {
    if (!place) return false;

    // 1. Explicit closed flag (Google Places / Supabase / cached state)
    if (place.open_status === 'CLOSED_FOR_REST_OF_TODAY' || place.open_status === 'CLOSED') {
      return false;
    }

    // 2. Explicit status text indicating Closed (e.g. "Closed · Opens 9:00 AM Mon", "Closed • Holiday")
    if (typeof place.status === 'string') {
      const s = place.status.trim().toLowerCase();
      if (s.startsWith('closed') || s.includes('• closed') || s.includes('closed •') || s.includes('closed ·') || s.includes('closed.')) {
        return false;
      }
    }

    // 3. Explicit 24/7 locations (e.g. The Sophia Way - Helen's Place)
    if (place.is24Seven === true) return true;

    const currentDay = targetDate.getDay(); // 0 = Sun, 1 = Mon, ..., 6 = Sat
    const currentHours = targetDate.getHours();
    const currentMins = targetDate.getMinutes();
    const currentTotalMin = currentHours * 60 + currentMins;
    const currentTimeStr = `${String(currentHours).padStart(2, '0')}${String(currentMins).padStart(2, '0')}`;

    // 4. Explicit closed days list (e.g. [0, 6] for weekends)
    if (Array.isArray(place.daysClosed) && place.daysClosed.includes(currentDay)) {
      return false;
    }

    // 5. Structured Google Places API opening_hours object (highest fidelity)
    if (place.opening_hours) {
      if (place.opening_hours.open_now === false && (!Array.isArray(place.opening_hours.periods) || place.opening_hours.periods.length === 0)) {
        return false;
      }

      if (Array.isArray(place.opening_hours.periods) && place.opening_hours.periods.length > 0) {
        const matchingPeriod = place.opening_hours.periods.find(p => {
          if (!p.open) return false;
          // 24/7 period: open on day 0 with time "0000" and no close
          if (p.open.day === 0 && p.open.time === '0000' && !p.close) return true;
          if (p.open.day !== currentDay) return false;
          if (!p.close) return true;

          const openTime = parseInt(p.open.time, 10);
          const closeTime = parseInt(p.close.time, 10);
          const currTimeNum = parseInt(currentTimeStr, 10);

          if (closeTime >= openTime) {
            return currTimeNum >= openTime && currTimeNum <= closeTime;
          } else {
            // Spans past midnight
            return currTimeNum >= openTime || currTimeNum <= closeTime;
          }
        });

        if (matchingPeriod) return true;
        // If structured periods exist and none matched for the requested day/time, place is closed
        return false;
      }
    }

    // 6. Daily hours range (HH:mm - HH:mm)
    if (place.hoursOpen && place.hoursClose) {
      const [oH, oM] = place.hoursOpen.split(':').map(Number);
      const [cH, cM] = place.hoursClose.split(':').map(Number);
      const openMin = oH * 60 + oM;
      const closeMin = cH * 60 + cM;
      return currentTotalMin >= openMin && currentTotalMin <= closeMin;
    }

    // 7. Explicit Google Places / Supabase open_status flag
    if (place.open_status === 'OPEN_NOW') return true;

    // 8. Fallback to status text
    if (typeof place.status === 'string') {
      const s = place.status.toLowerCase();
      if (s.includes('open 24') || s.includes('24/7') || s.startsWith('open') || s.includes('• open') || s.includes('open •') || s.includes('open ·')) {
        return true;
      }
    }

    return false;
  }
  window.isPlaceOpenNow = isPlaceOpenNow;

  // REAL COMBINED MULTI-FILTER FUNCTION (INTERSECTING AND LOGIC)
  function applyCombinedFilters() {
    const resources = getResourcesData();
    const savedIds = getSavedPlaceIds();

    // 1. Filter by category, scope, open-now time, and top Saved/Nearby mode
    const baseMatchingPins = resources.filter(pin => {
      // Top Saved mode match
      if (activeMapMode === 'saved') {
        if (!savedIds.includes(pin.id)) {
          return false;
        }
      }

      // Category Match
      const matchesCategory = activeSelectedCategories.includes('all') || activeSelectedCategories.includes(pin.category);

      // Verified Scope Match
      let matchesScope = true;
      if (activeScopeFilter === 'verified') {
        matchesScope = (pin.verifiedOnly === true);
      }

      // Dynamic "Open Now" Real-Time Hours Status Check
      let matchesOpenNow = true;
      if (isOpenNowFilterActive) {
        matchesOpenNow = isPlaceOpenNow(pin);
      }

      return matchesCategory && matchesScope && matchesOpenNow;
    });

    // 2. Radius distance filtering:
    // In 'nearby' mode, enforce strict radius distance threshold.
    // In 'saved' mode, prioritize showing the user's bookmarked places while calculating their distance.
    const filteredPins = (activeMapMode === 'saved')
      ? baseMatchingPins.map(place => {
          const refCoords = getActiveReferenceCoords();
          const dist = calculateDistanceMiles(refCoords.lat, refCoords.lng, place.lat, place.lng);
          return { ...place, distanceMiles: dist };
        })
      : filterPlacesByRadius(baseMatchingPins, activeRadiusMiles);

    renderLeafletMarkers(filteredPins);
    renderDrawerPlaces(filteredPins);
  }

  function updateVisiblePlaces() {
    applyCombinedFilters();
  }
  window.updateVisiblePlaces = updateVisiblePlaces;

  function renderLeafletMarkers(items) {
    if (!map) return;
    mapMarkers.forEach(m => map.removeLayer(m.marker));
    mapMarkers = [];

    items.forEach(res => {
      const customIcon = L.divIcon({
        className: 'custom-leaflet-pin',
        html: `
          <div class="px-2.5 py-1 bg-[#0F141C] text-white font-extrabold text-[11px] rounded-full shadow-xl border border-white/20 flex items-center gap-1.5 transform hover:scale-110 transition-transform">
            <span class="text-xs">${res.icon || '📍'}</span>
            <span class="truncate max-w-[90px] text-slate-100">${res.name}</span>
          </div>
        `,
        iconSize: [120, 30],
        iconAnchor: [60, 15]
      });

      const marker = L.marker([res.lat, res.lng], { icon: customIcon }).addTo(map);

      const isOpen = isPlaceOpenNow(res);

      const statusColor = isOpen
        ? 'text-emerald-400 font-bold'
        : 'text-red-400 font-bold';

      const statusDot = isOpen
        ? '<span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-1"></span>'
        : '<span class="inline-block w-2 h-2 rounded-full bg-red-400 mr-1"></span>';

      const popupContent = `
        <div class="space-y-1.5 text-slate-100 font-sans p-1">
          <div class="flex justify-between items-center">
            <span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 font-bold text-[10px] rounded-full uppercase">${res.category}</span>
            <div class="flex items-center gap-1.5">
              ${res.rating ? `<span class="text-[10px] font-extrabold text-amber-300">★ ${res.rating}</span>` : ''}
              ${res.verifiedOnly ? '<span class="text-[10px] text-amber-400 font-extrabold">✓ Verified</span>' : ''}
            </div>
          </div>
          <h4 class="font-extrabold text-sm text-white">${res.name}</h4>
          <p class="text-xs text-slate-300">📍 ${res.address}</p>
          <p class="text-xs flex items-center ${statusColor}">${statusDot}${res.status}</p>
          ${res.hoursOpen ? `<p class="text-[10px] text-slate-400 font-mono">🕒 Hours: ${res.hoursOpen} - ${res.hoursClose}</p>` : ''}
          ${res.details ? `<p class="text-[11px] text-slate-300 bg-slate-900 p-2 rounded-xl border border-slate-800 mt-1">${res.details}</p>` : ''}
          <div class="pt-2 border-t border-slate-800 flex items-center gap-1.5">
            <button onclick="toggleSavePlace('${res.id}')" class="flex-1 text-center py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-extrabold text-xs rounded-xl shadow transition-colors flex items-center justify-center gap-1">
              <span>${isPlaceSaved(res.id) ? '🔖 Saved' : '🔖 Save'}</span>
            </button>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${res.lat},${res.lng}&travelmode=walking" target="_blank" class="flex-1 text-center py-2 bg-emerald-500 text-slate-950 font-extrabold text-xs rounded-xl shadow hover:bg-emerald-400 transition-colors">
              🚶 Directions
            </a>
          </div>
        </div>
      `;

      marker.bindPopup(popupContent);
      mapMarkers.push({ resId: res.id, marker: marker, data: res });
    });

    // If chatbot/navigation supplied ?resource=<id>, wait until
    // all markers exist, then focus and open that exact resource.
    if (new URLSearchParams(window.location.search).get('resource')) {
      setTimeout(() => {
        focusResourceFromUrl();
      }, 500);
    }

  }

  function openAddResourceModal() {
    document.getElementById('add-resource-modal').classList.remove('hidden');
    document.getElementById('add-resource-modal').classList.add('flex');
  }

  function closeAddResourceModal() {
    document.getElementById('add-resource-modal').classList.add('hidden');
    document.getElementById('add-resource-modal').classList.remove('flex');
  }

  function handleCreateResource(e) {
    e.preventDefault();
    const title = document.getElementById('res-title').value;
    const category = document.getElementById('res-category').value;
    const hours = document.getElementById('res-hours').value || '08:00 - 20:00';
    const address = document.getElementById('res-address').value;
    const details = document.getElementById('res-details').value;

    const [hOpen, hClose] = hours.split('-').map(s => s.trim());

    const center = userLocationCoords || { lat: 47.6062, lng: -122.3321 };

    const newRes = {
      id: 'res-custom-' + Date.now(),
      name: title,
      category: category,
      lat: center.lat + (Math.random() * 0.01 - 0.005),
      lng: center.lng + (Math.random() * 0.01 - 0.005),
      rating: 5.0,
      open_status: 'OPEN_NOW',
      status: 'Open Now • Community Submitted',
      address: address,
      icon: category === 'food' ? '🍲' : category === 'shelter' ? '🛏️' : category === 'work' ? '💼' : '📍',
      details: details,
      verifiedOnly: true,
      hoursOpen: hOpen || "08:00",
      hoursClose: hClose || "20:00",
      daysClosed: [],
      is24Seven: false,
      opening_hours: {
        open_now: true,
        periods: [{ open: { day: 0, time: "0800" }, close: { day: 0, time: "2000" } }]
      }
    };

    const currentData = getResourcesData();
    currentData.unshift(newRes);
    localStorage.setItem(RESOURCE_STORAGE_KEY, JSON.stringify(currentData));

    closeAddResourceModal();
    applyCombinedFilters();

    if (typeof showNotification === 'function') {
      showNotification('✨ New resource published to live map!', 'success');
    }
  }

  // RADIUS MODIFIER LOGIC
  function setSearchRadius(miles) {
    activeRadiusMiles = miles;
    
    [5, 10, 25].forEach(m => {
      const btn = document.getElementById(`radius-btn-${m}`);
      if (btn) {
        if (m === miles) {
          btn.className = 'radius-pill-btn px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-[#0F141C] text-white shadow-sm transition-all';
        } else {
          btn.className = 'radius-pill-btn px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-all';
        }
      }
    });

    if (userRadiusCircle) {
      userRadiusCircle.setRadius(miles * 1609.34);
      if (map && typeof map.fitBounds === 'function') {
        map.fitBounds(userRadiusCircle.getBounds(), { padding: [20, 20], animate: true });
      }
    }

    updateVisiblePlaces();
  }

  function calculateDistanceMiles(lat1, lon1, lat2, lon2) {
    if (lat1 === undefined || lon1 === undefined || lat2 === undefined || lon2 === undefined) return 0;
    const R = 3958.8; // Radius of the Earth in miles
    const toRad = deg => (deg * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    const dist = R * c;
    return isNaN(dist) ? 0 : dist;
  }

  // BOTTOM DRAWER EXPAND / COLLAPSE & PLACES LIST RENDERING
  function toggleBottomDrawer(forceState) {
    const drawer = document.getElementById('bottom-drawer-sheet');
    if (!drawer) return;

    if (typeof forceState === 'boolean') {
      isDrawerExpanded = forceState;
    } else {
      isDrawerExpanded = !isDrawerExpanded;
    }

    if (isDrawerExpanded) {
      drawer.classList.add('expanded');
    } else {
      drawer.classList.remove('expanded');
    }
  }

  function renderDrawerPlaces(items) {
    const listEl = document.getElementById('places-list') || document.getElementById('drawer-content-list');
    const badgeEl = document.getElementById('drawer-count-badge');
    const titleEl = document.getElementById('drawer-title');
    if (!listEl) return;

    const count = items ? items.length : 0;
    if (badgeEl) {
      badgeEl.textContent = count;
    }
    if (titleEl) {
      titleEl.textContent = `Places & Resources (${count})`;
    }

    if (!items || items.length === 0) {
      listEl.innerHTML = `
        <div class="p-6 text-center text-slate-500">
          <span class="material-symbols-outlined text-3xl text-slate-400 mb-1">search_off</span>
          <p class="text-xs font-bold text-slate-700">No resources found</p>
          <p class="text-[11px] text-slate-500 mt-0.5">Try expanding your search radius (e.g. 10 or 25 mi) or adjusting filters.</p>
        </div>
      `;
      return;
    }

    const refCoords = getActiveReferenceCoords();

    const sorted = [...items].map(pin => {
      const dist = pin.distanceMiles !== undefined ? pin.distanceMiles : calculateDistanceMiles(refCoords.lat, refCoords.lng, pin.lat, pin.lng);
      return { ...pin, distanceMiles: dist };
    }).sort((a, b) => a.distanceMiles - b.distanceMiles);

    listEl.innerHTML = sorted.map(res => {
      const distStr = res.distanceMiles.toFixed(1) + ' mi';
      const catColor = res.category === 'food' ? 'text-rose-600 bg-rose-50'
                     : res.category === 'shelter' ? 'text-blue-600 bg-blue-50'
                     : res.category === 'work' ? 'text-amber-600 bg-amber-50'
                     : res.category === 'wifi' ? 'text-indigo-600 bg-indigo-50'
                     : res.category === 'restroom' ? 'text-teal-600 bg-teal-50'
                     : 'text-yellow-600 bg-yellow-50';

      const isOpen = isPlaceOpenNow(res);
      const statusBadge = isOpen 
        ? `<span class="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-600"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>${res.status}</span>`
        : `<span class="inline-flex items-center gap-1 text-[10px] font-bold text-red-600"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>${res.status}</span>`;

      const isSaved = isPlaceSaved(res.id);
      const saveBtnClass = isSaved 
        ? 'px-2.5 py-1 rounded-xl bg-amber-100 text-amber-900 border border-amber-300 font-extrabold text-[10px] flex items-center gap-1 shadow-sm transition-all hover:bg-amber-200' 
        : 'px-2.5 py-1 rounded-xl bg-slate-100 text-slate-700 border border-slate-200 font-bold text-[10px] flex items-center gap-1 shadow-sm transition-all hover:bg-slate-200';
      const saveIcon = isSaved ? 'bookmark' : 'bookmark_border';
      const saveText = isSaved ? 'Saved' : 'Save';

      return `
        <div class="p-2.5 bg-slate-50 hover:bg-slate-100/90 rounded-2xl border border-slate-200/70 shadow-sm flex items-center justify-between gap-2.5 transition-all">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5 mb-0.5">
              <span class="text-sm flex-shrink-0">${res.icon || '📍'}</span>
              <h5 class="text-xs font-extrabold text-slate-900 truncate">${res.name}</h5>
              ${res.rating ? `<span class="text-[10px] font-black text-amber-500 flex items-center gap-0.5">★${res.rating}</span>` : ''}
              ${res.verifiedOnly ? '<span class="text-[9px] text-amber-500 font-black flex-shrink-0" title="Verified">✓</span>' : ''}
              ${isSaved ? '<span class="text-[9px] px-1.5 py-0.2 rounded-full bg-amber-100 text-amber-800 font-bold flex items-center gap-0.5">🔖 Saved</span>' : ''}
            </div>
            <div class="flex items-center gap-1.5 text-[11px] text-slate-500 mb-0.5">
              <span class="font-extrabold text-emerald-600 flex items-center gap-0.5">
                <span class="material-symbols-outlined text-[12px]">near_me</span>
                ${distStr} away
              </span>
              <span>•</span>
              <span class="px-1.5 py-0.2 rounded text-[10px] font-bold ${catColor} capitalize">${res.category}</span>
            </div>
            <div class="truncate">${statusBadge}</div>
          </div>
          <div class="flex flex-col items-end gap-1.5 flex-shrink-0">
            <div class="flex items-center gap-1">
              <button onclick="toggleSavePlace('${res.id}', event)" title="${isSaved ? 'Remove from Saved' : 'Save Place'}" class="${saveBtnClass}">
                <span class="material-symbols-outlined text-[13px] ${isSaved ? 'text-amber-600' : 'text-slate-500'}">${saveIcon}</span>
                <span>${saveText}</span>
              </button>
              <button onclick="selectAndFocusPlace('${res.id}', ${res.lat}, ${res.lng})" class="px-3 py-1 bg-[#0F141C] text-white hover:bg-slate-800 text-[11px] font-extrabold rounded-xl shadow-sm transition-all active:scale-95 flex items-center gap-1">
                <span>View</span>
                <span class="material-symbols-outlined text-[12px] text-emerald-400">arrow_forward</span>
              </button>
            </div>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${res.lat},${res.lng}&travelmode=walking" target="_blank" class="text-[10px] font-bold text-slate-500 hover:text-slate-800 pr-0.5">
              Directions ↗
            </a>
          </div>
        </div>
      `;
    }).join('');
  }


  function focusResourceFromUrl() {
    try {
      const params = new URLSearchParams(window.location.search);
      const resourceId = params.get('resource');

      if (!resourceId || !map) return false;

      const resources = getResourcesData();
      const resource = resources.find(
        r => String(r.id) === String(resourceId)
      );

      if (!resource) return false;

      const refCoords = getActiveReferenceCoords();
      const distanceMiles = calculateDistanceMiles(
        refCoords.lat,
        refCoords.lng,
        resource.lat,
        resource.lng
      );

      // Expand only enough to make this resource eligible/visible.
      // This happens once when arriving from the chatbot.
      if (Number.isFinite(distanceMiles) && distanceMiles > activeRadiusMiles) {
        if (distanceMiles <= 10) {
          activeRadiusMiles = 10;
        } else if (distanceMiles <= 25) {
          activeRadiusMiles = 25;
        } else {
          activeRadiusMiles = Math.ceil(distanceMiles + 1);
        }

        if (typeof updateVisiblePlaces === 'function') {
          updateVisiblePlaces();
        }
      }

      const targetMarker = mapMarkers.find(
        m => String(m.resId) === String(resourceId)
      );

      if (!targetMarker || !targetMarker.marker) {
        return false;
      }

      selectAndFocusPlace(
        resource.id,
        resource.lat,
        resource.lng,
        true
      );

      // IMPORTANT:
      // Remove the query parameter after the one-time deep-link focus.
      // This stops future radius/filter updates from re-focusing the resource.
      const cleanUrl = new URL(window.location.href);
      cleanUrl.searchParams.delete('resource');
      window.history.replaceState({}, '', cleanUrl.pathname + cleanUrl.search);

      return true;

    } catch (err) {
      console.warn('[NorthStar Map] Deep-link focus failed:', err);
      return false;
    }
  }

  window.focusResourceFromUrl = focusResourceFromUrl;

  function selectAndFocusPlace(resId, lat, lng, autoOpenPopup = false) {
    if (!map) return;

    window.northstarSelectedMapResourceId = String(resId);

    // Prevent moveend/zoomend from rebuilding all markers while
    // this one-time chatbot/map focus is happening.
    window.northstarProgrammaticMapFocus = true;

    map.flyTo([lat, lng], 16, {
      animate: true,
      duration: 0.8
    });

    setTimeout(() => {
      const targetMarker = mapMarkers.find(
        m => String(m.resId) === String(resId)
      );

      if (targetMarker && targetMarker.marker && autoOpenPopup) {
        const popup = targetMarker.marker.getPopup?.();

        if (popup) {
          popup.options.autoClose = false;
          popup.options.closeOnClick = false;
          popup.options.autoPan = false;
        }

        targetMarker.marker.openPopup();
      }

      // The one-time View on Map focus is now finished.
      window.northstarProgrammaticMapFocus = false;
    }, 1000);

    toggleBottomDrawer(false);
  }

  // TOUCH SWIPE-UP / SWIPE-DOWN GESTURE LISTENER FOR DRAWER HEADER
  document.addEventListener('DOMContentLoaded', () => {
    let touchStartY = 0;
    const header = document.getElementById('drawer-header');
    if (header) {
      header.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      header.addEventListener('touchend', (e) => {
        const touchEndY = e.changedTouches[0].clientY;
        const diffY = touchStartY - touchEndY;
        if (diffY > 30) {
          // Swiped up
          toggleBottomDrawer(true);
        } else if (diffY < -30) {
          // Swiped down
          toggleBottomDrawer(false);
        }
      }, { passive: true });
    }
  });
</script>
