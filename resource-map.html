<!DOCTYPE html>
<html class="light" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Northstar | Live Resource Map</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/northstar.css">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "error": "#ba1a1a",
                    "surface": "#f7f9fb",
                    "tertiary-container": "#0d1c2f",
                    "surface-variant": "#e0e3e5",
                    "on-primary-container": "#7c839b",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#bec6e0",
                    "on-surface": "#191c1e",
                    "surface-tint": "#565e74",
                    "on-background": "#191c1e",
                    "tertiary": "#000000",
                    "secondary": "#6d5e00",
                    "primary-fixed": "#dae2fd",
                    "on-primary": "#ffffff",
                    "surface-container-low": "#f2f4f6",
                    "tertiary-fixed": "#d5e3fd",
                    "on-error-container": "#93000a",
                    "on-primary-fixed": "#131b2e",
                    "secondary-fixed-dim": "#e2c62d",
                    "background": "#f7f9fb",
                    "on-tertiary-fixed-variant": "#3a485c",
                    "primary-container": "#131b2e",
                    "tertiary-fixed-dim": "#b9c7e0",
                    "outline": "#76777d",
                    "surface-container": "#eceef0",
                    "on-tertiary-container": "#76859b",
                    "on-surface-variant": "#45464d",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed": "#211b00",
                    "outline-variant": "#c6c6cd",
                    "surface-container-highest": "#e0e3e5",
                    "on-error": "#ffffff",
                    "surface-container-high": "#e6e8ea",
                    "on-tertiary-fixed": "#0d1c2f",
                    "primary": "#0d1c2f",
                    "surface-dim": "#d8dadc",
                    "surface-bright": "#f7f9fb",
                    "secondary-fixed": "#ffe24c",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed-variant": "#524600",
                    "inverse-on-surface": "#eff1f3",
                    "secondary-container": "#fcdf46",
                    "inverse-surface": "#2d3133",
                    "error-container": "#ffdad6",
                    "on-secondary-container": "#726200",
                    "inverse-primary": "#bec6e0",
                    "on-primary-fixed-variant": "#3f465c"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "2xl": "1rem",
                    "3xl": "1.5rem",
                    "full": "9999px"
            }
          },
        },
      }
</script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-0 sm:py-6 text-on-surface">

<!-- Mobile Frame Shell -->
<div class="app-frame w-full sm:max-w-[420px] min-h-screen sm:min-h-[860px] sm:max-h-[920px] bg-surface sm:rounded-[44px] shadow-[0_0_60px_rgba(0,0,0,0.6)] relative flex flex-col overflow-hidden border-0 sm:border-[8px] sm:border-slate-800">

    <!-- Top Status Bar -->
    <div class="bg-surface px-6 pt-3 pb-1 flex justify-between items-center text-xs font-semibold text-slate-500 z-50 select-none">
        <span class="status-clock">9:41</span>
        <div class="w-16 h-4 bg-slate-900 rounded-full flex items-center justify-center">
            <div class="w-2.5 h-2.5 rounded-full bg-slate-700"></div>
        </div>
        <div class="flex items-center gap-1.5">
            <span class="material-symbols-outlined text-xs">signal_cellular_4_bar</span>
            <span class="material-symbols-outlined text-xs">wifi</span>
            <span class="material-symbols-outlined text-xs text-amber-500">battery_50</span>
        </div>
    </div>

    <!-- App Header -->
    <header class="bg-surface/90 backdrop-blur-md sticky top-0 z-40 flex justify-between items-center w-full px-6 py-3 border-b border-slate-200/60">
        <div class="flex items-center gap-2">
            <a href="index.html" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-primary hover:bg-slate-200 transition-colors">
                <span class="material-symbols-outlined text-lg">arrow_back</span>
            </a>
            <h1 class="text-lg font-bold text-primary tracking-tight">Resource Map</h1>
        </div>
        <button onclick="downloadOfflineMapData()" class="flex items-center gap-1 text-[11px] font-extrabold bg-primary text-secondary-fixed px-3 py-1 rounded-full shadow hover:bg-slate-800 transition-colors">
            <span class="material-symbols-outlined text-sm">download_for_offline</span> Offline Save
        </button>
    </header>

    <!-- Map Canvas Container -->
    <div class="relative flex-grow flex flex-col overflow-hidden">
        
        <!-- Filter Bar Floating Top -->
        <div class="absolute top-3 left-0 w-full z-30 px-4 overflow-x-auto no-scrollbar">
            <div class="flex gap-2 min-w-max pb-1">
                <button data-filter="all" class="map-filter-pill px-3 py-1.5 rounded-full text-xs font-bold bg-primary text-on-primary shadow-md">
                    All Services
                </button>
                <button data-filter="shelter" class="map-filter-pill px-3 py-1.5 rounded-full text-xs font-bold bg-surface-container-lowest text-on-surface-variant border border-slate-200 shadow-sm hover:bg-slate-100">
                    🛏️ Shelters (42 Beds)
                </button>
                <button data-filter="food" class="map-filter-pill px-3 py-1.5 rounded-full text-xs font-bold bg-surface-container-lowest text-on-surface-variant border border-slate-200 shadow-sm hover:bg-slate-100">
                    🍲 Food & Water
                </button>
                <button data-filter="restroom" class="map-filter-pill px-3 py-1.5 rounded-full text-xs font-bold bg-surface-container-lowest text-on-surface-variant border border-slate-200 shadow-sm hover:bg-slate-100">
                    🚿 Restrooms & Showers
                </button>
                <button data-filter="transit" class="map-filter-pill px-3 py-1.5 rounded-full text-xs font-bold bg-surface-container-lowest text-on-surface-variant border border-slate-200 shadow-sm hover:bg-slate-100">
                    🚌 Transit Hubs
                </button>
            </div>
        </div>

        <!-- Simulated Interactive Map Graphics -->
        <div class="w-full h-full bg-slate-900 relative overflow-hidden flex items-center justify-center">
            
            <!-- Map Vector Roads Background Mockup -->
            <svg class="absolute inset-0 w-full h-full opacity-30 pointer-events-none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 0 100 Q 150 120 400 80" stroke="#475569" stroke-width="8" fill="none" />
                <path d="M 120 0 Q 140 250 200 600" stroke="#334155" stroke-width="12" fill="none" />
                <path d="M 0 350 L 400 320" stroke="#475569" stroke-width="6" fill="none" />
                <path d="M 280 0 L 260 600" stroke="#334155" stroke-width="10" fill="none" />
            </svg>

            <!-- User Location Marker -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 flex flex-col items-center pointer-events-none">
                <div class="w-6 h-6 rounded-full bg-blue-500/30 flex items-center justify-center calling-pulse">
                    <div class="w-3 h-3 rounded-full bg-blue-500 border-2 border-white shadow-lg"></div>
                </div>
                <span class="text-[9px] font-bold text-white bg-slate-900/90 px-1.5 py-0.5 rounded shadow mt-1">You are here</span>
            </div>

            <!-- Map Pin 1: St. Jude -->
            <button onclick="selectMapLocation('St. Jude Community Refuge', '14 Open Beds • 0.4 mi away', '124 Pine St', '14')" class="absolute top-[32%] left-[28%] z-20 flex flex-col items-center group active:scale-90 transition-transform">
                <div class="px-2 py-1 bg-emerald-600 text-white font-extrabold text-[11px] rounded-xl shadow-lg border-2 border-white flex items-center gap-1 group-hover:scale-110 transition-transform">
                    <span class="material-symbols-outlined text-xs">bed</span> St. Jude (14 Beds)
                </div>
                <div class="w-2 h-2 bg-emerald-600 rotate-45 -mt-1 border-r border-b border-white"></div>
            </button>

            <!-- Map Pin 2: Downtown Hope -->
            <button onclick="selectMapLocation('Downtown Hope Center', '5 Open Beds • 1.2 mi away', '580 4th Ave', '5')" class="absolute top-[65%] left-[55%] z-20 flex flex-col items-center group active:scale-90 transition-transform">
                <div class="px-2 py-1 bg-amber-500 text-slate-950 font-extrabold text-[11px] rounded-xl shadow-lg border-2 border-white flex items-center gap-1 group-hover:scale-110 transition-transform">
                    <span class="material-symbols-outlined text-xs">bed</span> Hope Center (5 Beds)
                </div>
                <div class="w-2 h-2 bg-amber-500 rotate-45 -mt-1 border-r border-b border-white"></div>
            </button>

            <!-- Map Pin 3: St. Vincent Meals -->
            <button onclick="selectMapLocation('St. Vincent Soup Kitchen', 'Warm Dinner @ 5:30 PM • 0.8 mi', '89 Market St', 'Meal')" class="absolute top-[22%] left-[62%] z-20 flex flex-col items-center group active:scale-90 transition-transform">
                <div class="px-2 py-1 bg-blue-600 text-white font-extrabold text-[11px] rounded-xl shadow-lg border-2 border-white flex items-center gap-1 group-hover:scale-110 transition-transform">
                    <span class="material-symbols-outlined text-xs">soup_kitchen</span> St. Vincent Meal
                </div>
                <div class="w-2 h-2 bg-blue-600 rotate-45 -mt-1 border-r border-b border-white"></div>
            </button>

        </div>

        <!-- Selected Location Sheet (Fixed at bottom above nav) -->
        <div id="map-detail-sheet" class="absolute bottom-16 left-0 w-full z-40 px-4 pb-2">
            <div class="glass-card-dark text-white p-4 rounded-2xl shadow-2xl border border-slate-700/80 space-y-3">
                <div class="flex justify-between items-start">
                    <div>
                        <span id="sheet-status-badge" class="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 font-bold text-[10px] rounded-full">VERIFIED ACTIVE • 14 BEDS FREE</span>
                        <h3 id="sheet-title" class="font-bold text-base mt-1">St. Jude Community Refuge</h3>
                        <p id="sheet-address" class="text-xs text-slate-300 flex items-center gap-1 mt-0.5">
                            <span class="material-symbols-outlined text-xs text-slate-400">location_on</span> 124 Pine St (0.4 mi away)
                        </p>
                    </div>
                </div>

                <div class="flex gap-2 pt-1 border-t border-slate-700/60">
                    <button onclick="showNotification('Bed reserved! Show your confirmation code at check-in.', 'success')" class="flex-1 py-2.5 bg-amber-400 text-slate-950 rounded-xl text-xs font-bold hover:bg-amber-300 transition-colors flex items-center justify-center gap-1 shadow">
                        <span class="material-symbols-outlined text-sm">bookmark_add</span> Reserve Bed
                    </button>
                    <a href="call-shelter.html" class="px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1 border border-slate-600">
                        <span class="material-symbols-outlined text-sm">call</span> Call
                    </a>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar (Pinned inside frame) -->
    <nav class="absolute bottom-0 left-0 w-full z-40 flex justify-around items-center px-2 py-2 bg-surface/95 backdrop-blur-xl shadow-[0px_-4px_25px_rgba(15,23,42,0.1)] border-t border-slate-200/80">
        <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary px-3 py-1.5 transition-colors" href="index.html">
            <span class="material-symbols-outlined text-xl">home</span>
            <span class="text-[11px] font-medium">Home</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary px-3 py-1.5 transition-colors" href="seeker-dashboard.html">
            <span class="material-symbols-outlined text-xl">dashboard</span>
            <span class="text-[11px] font-medium">Dashboard</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary px-3 py-1.5 transition-colors" href="resume-builder.html">
            <span class="material-symbols-outlined text-xl">description</span>
            <span class="text-[11px] font-medium">Resume</span>
        </a>
        <a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-2xl px-3 py-1.5 shadow-md starlight-glow" href="resource-map.html">
            <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">map</span>
            <span class="text-[11px] font-bold">Map</span>
        </a>
        <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary px-3 py-1.5 transition-colors" href="call-shelter.html">
            <span class="material-symbols-outlined text-xl">call</span>
            <span class="text-[11px] font-medium">Shelter</span>
        </a>
    </nav>

</div>

<script src="js/northstar.js"></script>
<script>
function selectMapLocation(name, status, address, beds) {
    document.getElementById('sheet-title').textContent = name;
    document.getElementById('sheet-address').innerHTML = `<span class="material-symbols-outlined text-xs text-slate-400">location_on</span> ${address}`;
    document.getElementById('sheet-status-badge').textContent = status.toUpperCase();
    showNotification(`Selected ${name}`, 'info');
}

function downloadOfflineMapData() {
    const offlinePins = [
        { name: 'St. Jude Community Refuge', address: '124 Pine St', beds: 14, type: 'shelter' },
        { name: 'Downtown Hope Center', address: '580 4th Ave', beds: 5, type: 'shelter' },
        { name: 'St. Vincent Soup Kitchen', address: '89 Market St', dinner: '5:30 PM', type: 'food' },
        { name: 'Metro Hygiene & Shower Hub', address: '302 2nd Ave', type: 'restroom' },
        { name: 'Central Transit Center Bus Stop', address: '3rd & Pine St', type: 'transit' }
    ];
    localStorage.setItem('northstar_offline_map_pins', JSON.stringify(offlinePins));
    showNotification('📥 Map & Shelter Pins saved for offline access!', 'success');
}
</script>
</body>
</html>
