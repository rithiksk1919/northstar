<!-- Google Maps JavaScript API Script with explicit callback -->
<script>
  let map;
  let mapMarkers = [];

  const allResources = [
    { id: '1', name: "St. Jude Community Refuge", category: "shelter", lat: 47.6101, lng: -122.3370, status: "14 Beds Available", address: "124 Pine St", distance: "0.4 mi (8 min walk)" },
    { id: '2', name: "Downtown Hope Center", category: "shelter", lat: 47.6032, lng: -122.3315, status: "5 Beds Left", address: "580 4th Ave", distance: "1.2 mi (18 min walk)" },
    { id: '3', name: "St. Vincent Soup Kitchen", category: "food", lat: 47.6088, lng: -122.3405, status: "Dinner @ 5:30 PM", address: "89 Market St", distance: "0.8 mi (12 min walk)" },
    { id: '4', name: "Pioneer Pantry & Bottled Water", category: "food", lat: 47.6005, lng: -122.3342, status: "Free Meal Packs", address: "210 1st Ave S", distance: "0.5 mi (10 min walk)" },
    { id: '5', name: "Metro Hygiene & Shower Hub", category: "restroom", lat: 47.6020, lng: -122.3328, status: "Clean Showers 24/7", address: "302 2nd Ave", distance: "0.3 mi (6 min walk)" },
    { id: '6', name: "Capitol Hill Public Restroom", category: "restroom", lat: 47.6142, lng: -122.3190, status: "Clean & Accessible 24/7", address: "1000 E Pike St", distance: "0.9 mi (15 min walk)" },
    { id: '7', name: "Pacific Freight Day Labor Hub", category: "work", lat: 47.6010, lng: -122.3360, status: "$21.50/hr • Walk-in Work", address: "450 1st Ave S", distance: "0.6 mi (11 min walk)" },
    { id: '8', name: "CleanCity Community Work Center", category: "work", lat: 47.6115, lng: -122.3280, status: "$20.00/hr • Flexible Shift", address: "800 E Denny Way", distance: "0.7 mi (13 min walk)" }
  ];

  window.gm_authFailure = function() {
    console.error("Google Maps API Auth Failure: Key restricted or Maps JavaScript API not enabled.");
  };

  function initGoogleMapEmbed() {
    const seattleCenter = { lat: 47.6062, lng: -122.3321 };
    const mapElement = document.getElementById('google-map-iframe-container');
    if (!mapElement) return;

    try {
      map = new google.maps.Map(mapElement, {
        zoom: 14,
        center: seattleCenter,
        disableDefaultUI: true,
        zoomControl: true,
        styles: [
          { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
          { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
          { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
          {
            featureType: "administrative.locality",
            elementType: "labels.text.fill",
            stylers: [{ color: "#d59563" }],
          },
          {
            featureType: "poi",
            elementType: "labels.text.fill",
            stylers: [{ color: "#d59563" }],
          },
          {
            featureType: "road",
            elementType: "geometry",
            stylers: [{ color: "#38414e" }],
          },
          {
            featureType: "road",
            elementType: "geometry.stroke",
            stylers: [{ color: "#212a37" }],
          },
          {
            featureType: "water",
            elementType: "geometry",
            stylers: [{ color: "#17263c" }],
          }
        ]
      });

      renderMarkers(allResources);
    } catch(err) {
      console.error('Google Maps Init Error:', err);
    }
  }

  function renderMarkers(items) {
    // Clear existing markers
    mapMarkers.forEach(m => m.setMap(null));
    mapMarkers = [];

    if (!map) return;

    items.forEach(res => {
      const marker = new google.maps.Marker({
        position: { lat: res.lat, lng: res.lng },
        map: map,
        title: res.name
      });

      const infowindow = new google.maps.InfoWindow({
        content: `
          <div style="color:#0f172a; padding:6px; font-family:sans-serif;">
            <h4 style="font-weight:bold; margin:0 0 4px 0; font-size:13px;">${res.name}</h4>
            <p style="font-size:11px; margin:0 0 4px 0; color:#475569;">📍 ${res.address} (${res.distance})</p>
            <p style="font-size:11px; font-weight:bold; margin:0 0 6px 0; color:#059669;">${res.status}</p>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${res.lat},${res.lng}&travelmode=walking" target="_blank" style="display:inline-block; padding:5px 10px; background:#0f172a; color:#fff; text-decoration:none; font-size:11px; border-radius:6px; font-weight:bold;">
              🚶 Get Walking Directions
            </a>
          </div>
        `
      });

      marker.addListener('click', () => {
        infowindow.open(map, marker);
      });

      mapMarkers.push(marker);
    });
  }

  function filterMapResources(category = 'all', searchQuery = '') {
    const q = searchQuery.toLowerCase().trim();
    const filtered = allResources.filter(res => {
      const matchCategory = category === 'all' || res.category === category;
      const matchQuery = !q || 
        res.name.toLowerCase().includes(q) || 
        res.address.toLowerCase().includes(q) || 
        res.status.toLowerCase().includes(q) ||
        res.category.toLowerCase().includes(q);
      return matchCategory && matchQuery;
    });

    renderMarkers(filtered);
  }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCzEt3AWGJrePRSa8Gp9JgTCx7oEHnrAP8&callback=initGoogleMapEmbed" async defer></script>

<script src="js/northstar.js"></script>
<script>
let currentSelectedCategory = 'all';

function selectCategoryFilter(cat) {
  currentSelectedCategory = cat;
  
  // Highlight active pill button
  document.querySelectorAll('.cat-filter-btn').forEach(btn => {
    if (btn.dataset.cat === cat) {
      btn.className = 'cat-filter-btn px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-400 text-slate-950 shadow';
    } else {
      btn.className = 'cat-filter-btn px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700';
    }
  });

  const query = document.getElementById('walkable-search-input').value;
  filterMapResources(currentSelectedCategory, query);
}

function handleSearchFilterInput() {
  const query = document.getElementById('walkable-search-input').value;
  filterMapResources(currentSelectedCategory, query);
}

function clearSearchInput() {
  const input = document.getElementById('walkable-search-input');
  input.value = '';
  filterMapResources(currentSelectedCategory, '');
}

function downloadOfflineMapData() {
    const offlinePins = [
        { name: 'St. Jude Community Refuge', address: '124 Pine St', beds: 14, type: 'shelter' },
        { name: 'Downtown Hope Center', address: '580 4th Ave', beds: 5, type: 'shelter' },
        { name: 'St. Vincent Soup Kitchen', address: '89 Market St', dinner: '5:30 PM', type: 'food' },
        { name: 'Metro Hygiene & Shower Hub', address: '302 2nd Ave', type: 'restroom' }
    ];
    localStorage.setItem('northstar_offline_map_pins', JSON.stringify(offlinePins));
    showNotification('📥 Walkable Resources saved for offline access!', 'success');
}
</script>
