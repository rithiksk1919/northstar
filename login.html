<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Northstar | Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="css/northstar.css">
    <style>
        /* ==========================================================================
           DYNAMIC DEVICE THEME DETECTION (@media prefers-color-scheme)
           ========================================================================== */

        /* Light Mode Defaults */
        :root {
            --auth-bg: #f8fafc;
            --auth-card-bg: #ffffff;
            --auth-card-border: #e2e8f0;
            --auth-input-bg: #ffffff;
            --auth-input-border: #e2e8f0;
            --auth-input-text: #1e293b;
            --auth-input-placeholder: #94a3b8;
            --auth-text-primary: #0f172a;
            --auth-text-secondary: #64748b;
            --auth-cta-bg: #facc15;
            --auth-cta-text: #0f172a;
            --auth-error: #ef4444;
        }

        /* Dark Mode: Dynamic Device Theme Detection via OS Settings */
        @media (prefers-color-scheme: dark) {
            :root:not(.light) {
                --auth-bg: #0f172a;
                --auth-card-bg: #1e293b;
                --auth-card-border: #334155;
                --auth-input-bg: #0f172a;
                --auth-input-border: #334155;
                --auth-input-text: #f8fafc;
                --auth-input-placeholder: #64748b;
                --auth-text-primary: #f8fafc;
                --auth-text-secondary: #94a3b8;
                --auth-cta-bg: #facc15;
                --auth-cta-text: #0f172a;
            }

            body.auth-page-body:not(.light),
            .auth-page:not(.light) {
                background-color: #0f172a !important;
                color: #f8fafc !important;
            }

            .auth-card:not(.light) {
                background-color: #1e293b !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
            }

            .auth-input:not(.light) {
                background-color: #0f172a !important;
                border-color: #334155 !important;
                color: #f8fafc !important;
            }

            .auth-input:not(.light)::placeholder {
                color: #64748b !important;
            }

            .auth-title:not(.light) {
                color: #f8fafc !important;
            }

            .auth-subtitle:not(.light) {
                color: #94a3b8 !important;
            }
        }

        /* Explicit class-based overrides */
        html.dark {
            --auth-bg: #0f172a;
            --auth-card-bg: #1e293b;
            --auth-card-border: #334155;
            --auth-input-bg: #0f172a;
            --auth-input-border: #334155;
            --auth-input-text: #f8fafc;
            --auth-input-placeholder: #64748b;
            --auth-text-primary: #f8fafc;
            --auth-text-secondary: #94a3b8;
            --auth-cta-bg: #facc15;
            --auth-cta-text: #0f172a;
        }

        html.dark body.auth-page-body,
        html.dark .auth-page {
            background-color: #0f172a !important;
            color: #f8fafc !important;
        }

        html.dark .auth-card {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        html.dark .auth-input {
            background-color: #0f172a !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }

        html.dark .auth-input::placeholder {
            color: #64748b !important;
        }

        html.dark .auth-title {
            color: #f8fafc !important;
        }

        html.dark .auth-subtitle {
            color: #94a3b8 !important;
        }

        /* Applied Element Styles */
        body.auth-page-body {
            background-color: var(--auth-bg);
            color: var(--auth-text-primary);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .auth-card {
            background-color: var(--auth-card-bg);
            border: 1px solid var(--auth-card-border);
            color: var(--auth-text-primary);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .auth-input {
            background-color: var(--auth-input-bg);
            border: 1px solid var(--auth-input-border);
            color: var(--auth-input-text);
            transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .auth-input::placeholder {
            color: var(--auth-input-placeholder);
        }

        .auth-input:focus {
            outline: none;
            border-color: #facc15 !important;
            box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.2);
        }

        /* Red border on validation failure */
        .auth-input.input-error {
            border-color: #ef4444 !important;
        }

        .auth-cta-btn {
            background-color: var(--auth-cta-bg) !important;
            color: var(--auth-cta-text) !important;
            border: 1px solid #fde047;
            font-weight: 800;
        }

        .auth-cta-btn:hover {
            filter: brightness(1.04);
        }

        .auth-cta-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="auth-page-body min-h-screen flex items-center justify-center p-0 sm:py-6 font-sans selection:bg-amber-500/30 selection:text-amber-900">

    <!-- Mobile / Desktop Centered Card Frame -->
    <div class="auth-page w-full sm:max-w-[420px] min-h-screen sm:min-h-[860px] sm:max-h-[920px] sm:rounded-[44px] shadow-2xl relative flex flex-col items-center justify-center p-4 sm:p-6 overflow-hidden border-0 sm:border-[8px] sm:border-slate-300 z-10">

        <div class="relative z-10 w-full max-w-[360px] mx-auto my-auto flex flex-col items-center justify-center py-4 space-y-4 sm:space-y-5">
            
            <!-- Brand Header Lockup -->
            <div class="text-center space-y-1.5 w-full">
                <div class="w-16 h-16 bg-white dark:bg-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-2.5 shadow-md p-2 border border-slate-200/90 dark:border-slate-700">
                    <img src="northstar-logo.png" class="w-full h-full object-contain" alt="NorthStar Logo">
                </div>
                <h1 class="auth-title text-2xl sm:text-3xl font-black font-heading tracking-tight">Northstar</h1>
                <p class="auth-subtitle text-xs sm:text-sm font-medium">Navigate. Connect. Move Forward.</p>
            </div>

            <!-- Auth Container Card -->
            <div class="auth-card rounded-2xl p-5 sm:p-6 shadow-[0_10px_28px_rgba(0,0,0,0.06)] space-y-4 w-full">

                <!-- Segmented Controller (Sign In vs Create Account) -->
                <div class="bg-slate-100 dark:bg-slate-800/80 p-1.5 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center shadow-inner">
                    <button type="button" id="tab-login" onclick="switchAuthTab('login')" class="flex-1 h-10 text-xs sm:text-sm font-extrabold rounded-lg bg-slate-950 dark:bg-amber-400 text-white dark:text-slate-950 shadow-sm transition-all duration-200">
                        Sign In
                    </button>
                    <button type="button" id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 h-10 text-xs sm:text-sm font-bold rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-950 dark:hover:text-white transition-all duration-200">
                        Create Account
                    </button>
                </div>

                <!-- Strict Auth Form -->
                <form id="auth-form" onsubmit="handleAuthFormSubmit(event)" class="space-y-3" novalidate>
                    
                    <!-- Role Selection (Shown ONLY during Create Account mode) -->
                    <div id="role-selection-container" class="hidden space-y-1.5 pb-1">
                        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Select Account Role</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" id="role-btn-seeker" onclick="setAuthRole('seeker')" 
                                class="h-11 px-3 text-xs sm:text-sm font-extrabold rounded-xl border border-amber-400 bg-amber-500/15 text-amber-900 dark:text-amber-300 flex items-center justify-center gap-1.5 transition-all">
                                <span class="material-symbols-outlined text-base text-amber-600 dark:text-amber-400">search</span> Seeker
                            </button>
                            <button type="button" id="role-btn-volunteer" onclick="setAuthRole('volunteer')" 
                                class="h-11 px-3 text-xs sm:text-sm font-bold rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 flex items-center justify-center gap-1.5 transition-all">
                                <span class="material-symbols-outlined text-base text-slate-600 dark:text-slate-400">volunteer_activism</span> Volunteer
                            </button>
                        </div>
                    </div>

                    <div>
                        <input type="email" id="auth-email" placeholder="Email address" required class="auth-input w-full h-12 px-4 rounded-xl text-sm font-medium">
                    </div>
                    <div>
                        <input type="password" id="auth-password" placeholder="Password (min 6 characters)" minlength="6" required class="auth-input w-full h-12 px-4 rounded-xl text-sm font-medium">
                    </div>

                    <!-- Inline Error Alert Message -->
                    <div id="auth-error-message" class="auth-error-message hidden text-xs font-semibold px-3.5 py-2.5 rounded-xl border border-red-500 bg-red-500/10 text-[#f87171]" style="border: 1px solid #ef4444; background: rgba(239, 68, 68, 0.1); color: #f87171; border-radius: 0.75rem; padding: 10px 14px;" role="alert"></div>

                    <!-- Primary Yellow CTA Button -->
                    <button type="submit" id="auth-submit-btn" class="auth-cta-btn w-full h-12 rounded-xl text-sm shadow-sm transition-all flex items-center justify-center">
                        Sign In
                    </button>
                </form>
            </div>

            <!-- Divider -->
            <div class="relative py-1 text-center w-full">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-300/80 dark:border-slate-700"></div></div>
                <span class="relative px-3 text-[11px] font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500 bg-inherit">Or</span>
            </div>

            <!-- Guest Access CTA -->
            <div class="space-y-2 text-center w-full">
                <a href="seeker-dashboard.html"
                  class="w-full h-12 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-white font-bold rounded-xl text-sm shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-1.5 cursor-pointer">
                  <span>Continue as Guest &rarr;</span>
                </a>
                <p class="auth-subtitle text-[11px] font-medium leading-relaxed">Instant access to emergency resources. No registration required.</p>
            </div>

        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[300] w-11/12 max-w-md flex flex-col gap-2 pointer-events-none"></div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
</body>
</html>
